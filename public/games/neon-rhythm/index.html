<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rhythm | Arcadia</title>
    <style>
        :root { --void: #000; --accent: #8B5CF6; --accent2: #EC4899; --text: #F9FAFB; }
        body { margin: 0; background: var(--void); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 60px; text-align: center; width: 100%; pointer-events: none; }
        #score { font-size: 48px; font-weight: 900; letter-spacing: -2px; text-shadow: 0 0 25px var(--accent); }
        #streak { font-size: 16px; font-weight: 800; color: #F59E0B; letter-spacing: 3px; opacity: 0; transition: opacity 0.3s; margin-top: 4px; }
        #feedback { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 24px; font-weight: 900; pointer-events: none; opacity: 0; transition: opacity 0.2s; letter-spacing: 4px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; padding: 18px 52px; border-radius: 16px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(139,92,246,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="streak">🔥 5x STREAK</div>
    </div>
    <div id="feedback"></div>
    <div id="overlay">
        <h1 id="title">NEON RHYTHM</h1>
        <p id="subtitle">TAP WHEN CIRCLES ALIGN</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-perfect">Perfect: 0</div>
            <div class="sm" id="stat-good">Good: 0</div>
            <div class="sm" id="stat-miss">Missed: 0</div>
            <div class="sm" id="stat-streak">Best streak: 0</div>
        </div>
        <button class="btn" id="start-btn">START BEAT</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const feedbackEl = document.getElementById('feedback');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, frame = 0;
        let circles = [], particles = [], pulseWaves = [];
        let targetRadius = 55;
        let streak = 0, bestStreak = 0, perfects = 0, goods = 0, missed = 0;
        let consecutiveMisses = 0;
        let bgPulse = 0, shakeX = 0, shakeY = 0, shakeDur = 0;
        let speed = 2;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: "1.0", type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post("LIFECYCLE", "READY");

        function shake(intensity, dur) { shakeDur = dur; shakeX = (Math.random() - 0.5) * intensity; shakeY = (Math.random() - 0.5) * intensity; }

        function burst(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const vel = 2 + Math.random() * 5;
                particles.push({ x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel, life: 1, decay: 0.025, color, size: 2 + Math.random() * 3 });
            }
        }

        function showFeedback(text, color) {
            feedbackEl.textContent = text;
            feedbackEl.style.color = color;
            feedbackEl.style.opacity = '1';
            feedbackEl.style.textShadow = `0 0 20px ${color}`;
            setTimeout(() => feedbackEl.style.opacity = '0', 600);
        }

        function addPulseWave(color) {
            pulseWaves.push({ r: targetRadius, alpha: 0.5, color });
        }

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; circles = []; particles = []; pulseWaves = [];
            streak = 0; bestStreak = 0; perfects = 0; goods = 0; missed = 0;
            consecutiveMisses = 0; speed = 2; frame = 0;
            scoreEl.textContent = '0';
            post("GAMEPLAY", "GAME_START");
        };

        function tap() {
            if (!playing) return;
            let hit = false;
            let bestDiff = Infinity;
            let bestIdx = -1;

            circles.forEach((c, i) => {
                const diff = Math.abs(c.r - targetRadius);
                if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
            });

            if (bestIdx >= 0 && bestDiff < 25) {
                hit = true;
                const c = circles[bestIdx];
                consecutiveMisses = 0;

                if (bestDiff < 6) {
                    perfects++;
                    score += 100; streak++;
                    const multiplier = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
                    score += (multiplier - 1) * 50;
                    showFeedback('PERFECT!', '#10B981');
                    burst(W / 2, H / 2, '#10B981', 25);
                    addPulseWave('#10B981');
                    bgPulse = 1;
                } else if (bestDiff < 15) {
                    goods++;
                    score += 50; streak++;
                    showFeedback('GOOD', '#3B82F6');
                    burst(W / 2, H / 2, '#3B82F6', 15);
                    addPulseWave('#3B82F6');
                    bgPulse = 0.6;
                } else {
                    score += 20; streak++;
                    showFeedback('OK', '#F59E0B');
                    burst(W / 2, H / 2, '#F59E0B', 8);
                    bgPulse = 0.3;
                }

                if (streak > bestStreak) bestStreak = streak;
                circles.splice(bestIdx, 1);
                scoreEl.textContent = score;
                post("GAMEPLAY", "SCORE_UPDATE", { score, streak });
            }

            if (!hit) {
                streak = 0;
                shake(5, 8);
                showFeedback('MISS', '#EF4444');
            }

            streakEl.style.opacity = streak >= 3 ? '1' : '0';
            streakEl.textContent = `🔥 ${streak}x STREAK`;
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); tap(); }, { passive: false });
        window.addEventListener('mousedown', tap);

        function update() {
            if (!playing) return;
            frame++;

            // Speed increases over time
            speed = 2 + score / 600;

            // Spawn circles
            const spawnChance = 0.02 + score / 8000;
            if (Math.random() < spawnChance && circles.length < 4) {
                circles.push({ r: 200 + Math.random() * 80, hue: Math.random() * 360 });
            }

            // Move circles
            circles.forEach((c, i) => {
                c.r -= speed;
                if (c.r < targetRadius - 25) {
                    circles.splice(i, 1);
                    missed++;
                    consecutiveMisses++;
                    if (streak > 0) streak = 0;
                    if (consecutiveMisses >= 3) { gameOver(); return; }
                }
            });

            // BG pulse decay
            if (bgPulse > 0) bgPulse = Math.max(0, bgPulse - 0.02);

            // Shake decay
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Pulse waves
            for (let i = pulseWaves.length - 1; i >= 0; i--) {
                const pw = pulseWaves[i];
                pw.r += 4; pw.alpha -= 0.015;
                if (pw.alpha <= 0) pulseWaves.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            ctx.translate(shakeX, shakeY);

            // Background
            ctx.fillStyle = '#000';
            ctx.fillRect(-5, -5, W + 10, H + 10);

            // Background pulse
            if (bgPulse > 0) {
                const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.5);
                grad.addColorStop(0, `rgba(139, 92, 246, ${bgPulse * 0.15})`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            // Target zone ring
            ctx.strokeStyle = '#8B5CF6';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20; ctx.shadowColor = '#8B5CF6';
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, targetRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Target zone fill
            ctx.globalAlpha = 0.08 + Math.sin(frame * 0.05) * 0.03;
            ctx.fillStyle = '#8B5CF6';
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Perfect zone indicator
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 6]);
            ctx.beginPath(); ctx.arc(W / 2, H / 2, targetRadius - 6, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(W / 2, H / 2, targetRadius + 6, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);

            // Pulse waves
            pulseWaves.forEach(pw => {
                ctx.globalAlpha = pw.alpha;
                ctx.strokeStyle = pw.color;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(W / 2, H / 2, pw.r, 0, Math.PI * 2); ctx.stroke();
            });
            ctx.globalAlpha = 1;

            // Incoming circles
            circles.forEach(c => {
                const diff = Math.abs(c.r - targetRadius);
                const inZone = diff < 15;
                const inPerfect = diff < 6;

                let color = `hsla(${c.hue}, 70%, 65%, 0.7)`;
                let lineW = 2.5;
                if (inPerfect) { color = '#10B981'; lineW = 5; }
                else if (inZone) { color = '#3B82F6'; lineW = 4; }

                ctx.strokeStyle = color;
                ctx.lineWidth = lineW;
                if (inZone) { ctx.shadowBlur = 15; ctx.shadowColor = color; }
                ctx.beginPath();
                ctx.arc(W / 2, H / 2, c.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // Miss indicator
            if (consecutiveMisses >= 1) {
                ctx.fillStyle = '#EF4444';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.textAlign = 'center';
                const y = H / 2 + targetRadius + 40;
                for (let i = 0; i < 3; i++) {
                    ctx.globalAlpha = i < consecutiveMisses ? 0.8 : 0.15;
                    ctx.fillText('✕', W / 2 - 20 + i * 20, y);
                }
                ctx.globalAlpha = 1;
            }

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post("GAMEPLAY", "GAME_COMPLETE", { score, perfects, goods, missed, bestStreak, status: 'loss' });

            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'BEAT DROPPED';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box');
            stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-perfect').textContent = `Perfect: ${perfects}`;
            document.getElementById('stat-good').textContent = `Good: ${goods}`;
            document.getElementById('stat-miss').textContent = `Missed: ${missed}`;
            document.getElementById('stat-streak').textContent = `Best streak: ${bestStreak}x`;
            startBtn.textContent = 'REPLAY';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
