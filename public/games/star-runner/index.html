<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Runner | Arcadia</title>
    <style>
        :root { --void: #030712; --accent: #F59E0B; --accent2: #EF4444; --text: #F9FAFB; }
        body { margin: 0; background: var(--void); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 50px; left: 24px; pointer-events: none; }
        #score { font-size: 36px; font-weight: 900; text-shadow: 0 0 20px var(--accent); }
        #speed-label { font-size: 12px; color: #6B7280; letter-spacing: 3px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(245,158,11,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="speed-label">DISTANCE</div>
    </div>
    <div id="overlay">
        <h1 id="title">STAR RUNNER</h1>
        <p id="subtitle">TAP TO JUMP · DODGE OBSTACLES</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-dist">Distance: 0</div>
            <div class="sm" id="stat-jumps">Jumps: 0</div>
            <div class="sm" id="stat-near">Near misses: 0</div>
        </div>
        <button class="btn" id="start-btn">RUN</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0, score = 0;
        let player, obstacles, particles, scorePops, stars;
        let speed, groundY, jumpCount, nearMisses;
        let shakeX = 0, shakeY = 0, shakeDur = 0;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; groundY = H * 0.78; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function shake(i, d) { shakeDur = d; shakeX = (Math.random() - 0.5) * i; shakeY = (Math.random() - 0.5) * i; }
        function burst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i;
                const v = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, decay: 0.025, color, size: 2 + Math.random() * 3 });
            }
        }
        function addPop(x, y, text, color) { scorePops.push({ x, y, text, color, life: 1, vy: -2 }); }

        function initStars() {
            stars = [];
            for (let layer = 0; layer < 3; layer++)
                for (let i = 0; i < 25; i++)
                    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.75, r: 0.5 + Math.random() * (layer + 1) * 0.5, v: (layer + 1) * 0.4, alpha: 0.15 + layer * 0.1, layer });
        }

        function initGame() {
            player = { x: W * 0.15, y: groundY, vy: 0, grounded: true, trail: [], rotation: 0 };
            obstacles = []; particles = []; scorePops = [];
            score = 0; speed = 4; jumpCount = 0; nearMisses = 0; frame = 0;
            initStars();
        }

        function spawnObstacle() {
            const types = ['spike', 'tall', 'gap', 'moving'];
            const type = types[Math.floor(Math.random() * types.length)];
            let w, h, baseline = groundY;
            if (type === 'spike') { w = 18; h = 35 + Math.random() * 25; }
            else if (type === 'tall') { w = 14; h = 60 + Math.random() * 40; }
            else if (type === 'gap') { w = 30 + Math.random() * 20; h = 18; baseline = groundY - 60 - Math.random() * 40; }
            else { w = 20; h = 30; baseline = groundY - 40 - Math.random() * 30; }

            obstacles.push({ x: W + 50, y: baseline - h, w, h, type, passed: false, nearMissed: false, movePhase: Math.random() * Math.PI * 2 });
        }

        function jump() {
            if (!playing) return;
            if (player.grounded) {
                player.vy = -13.5;
                player.grounded = false;
                jumpCount++;
                burst(player.x, player.y + 14, 'rgba(245,158,11,0.5)', 6);
            }
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
        window.addEventListener('mousedown', jump);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            initGame(); post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;
            speed = 4 + score / 250;

            // Player physics
            player.vy += 0.55;
            player.y += player.vy;
            if (player.y >= groundY) { player.y = groundY; player.vy = 0; player.grounded = true; }
            if (!player.grounded) player.rotation += 0.08;
            else player.rotation = 0;

            // Trail
            player.trail.push({ x: player.x, y: player.y, alpha: 1 });
            if (player.trail.length > 10) player.trail.shift();
            player.trail.forEach(t => t.alpha -= 0.1);

            // Engine particles when grounded
            if (player.grounded && frame % 3 === 0) {
                particles.push({ x: player.x - 8, y: groundY + 10, vx: -speed * 0.5 + (Math.random() - 0.5), vy: -Math.random() * 1.5, life: 0.5, decay: 0.04, color: 'rgba(245,158,11,0.3)', size: 2 });
            }

            // Stars
            stars.forEach(s => { s.x -= s.v * (speed / 4); if (s.x < -5) { s.x = W + 5; s.y = Math.random() * H * 0.75; } });

            // Obstacle spawn
            if (frame % Math.max(30, 70 - Math.floor(speed * 3)) === 0) spawnObstacle();

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= speed;
                if (o.type === 'moving') o.y += Math.sin(o.movePhase + frame * 0.05) * 1.5;

                const px = player.x, py = player.y, pr = 11;
                // Collision
                if (px + pr > o.x && px - pr < o.x + o.w && py + pr > o.y && py - pr < o.y + o.h) {
                    gameOver(); return;
                }
                // Near miss
                if (!o.nearMissed && px + pr + 8 > o.x && px - pr - 8 < o.x + o.w && py + pr + 12 > o.y && py - pr - 12 < o.y + o.h) {
                    if (!(px + pr > o.x && px - pr < o.x + o.w && py + pr > o.y && py - pr < o.y + o.h)) {
                        o.nearMissed = true; nearMisses++; score += 5;
                        addPop(o.x, o.y - 10, '+5', '#F59E0B');
                    }
                }
                // Passed
                if (!o.passed && o.x + o.w < px) {
                    o.passed = true; score += 10;
                    addPop(px, py - 30, '+10', '#fff');
                    scoreEl.textContent = score;
                    if (score % 50 === 0) post('GAMEPLAY', 'SCORE_UPDATE', { score });
                }
                if (o.x + o.w < -50) obstacles.splice(i, 1);
            }

            // Shake, particles, pops
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = scorePops.length - 1; i >= 0; i--) { const s = scorePops[i]; s.y += s.vy; s.life -= 0.02; if (s.life <= 0) scorePops.splice(i, 1); }
        }

        function draw() {
            ctx.save(); ctx.translate(shakeX, shakeY);
            ctx.fillStyle = '#030712'; ctx.fillRect(-5, -5, W + 10, H + 10);

            // Stars
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha; ctx.fillStyle = s.layer === 2 ? '#F59E0B' : '#fff';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
            }); ctx.globalAlpha = 1;

            // Ground
            const gY = groundY + 14;
            const gGrad = ctx.createLinearGradient(0, gY, 0, gY + 40);
            gGrad.addColorStop(0, 'rgba(245,158,11,0.1)'); gGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = gGrad; ctx.fillRect(0, gY, W, 40);
            ctx.strokeStyle = 'rgba(245,158,11,0.2)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, gY); ctx.lineTo(W, gY); ctx.stroke();

            // Ground dashes
            ctx.strokeStyle = 'rgba(245,158,11,0.06)';
            const off = (frame * speed) % 40;
            for (let x = -off; x < W + 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, gY + 8); ctx.lineTo(x + 15, gY + 8); ctx.stroke(); }

            // Speed lines
            if (speed > 6) {
                ctx.globalAlpha = Math.min(0.25, (speed - 6) * 0.04);
                for (let i = 0; i < 4; i++) {
                    const ly = Math.random() * H * 0.7;
                    ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(W, ly); ctx.lineTo(W - 40 - Math.random() * 50, ly); ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            // Player trail
            player.trail.forEach(t => { if (t.alpha <= 0) return; ctx.globalAlpha = t.alpha * 0.25; ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            // Player - triangle spaceship
            ctx.save(); ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            ctx.fillStyle = '#F59E0B'; ctx.shadowBlur = 20; ctx.shadowColor = '#F59E0B';
            ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-6, 0); ctx.lineTo(-10, 11); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-4, -6); ctx.lineTo(-1, 0); ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0; ctx.restore();

            // Obstacles
            obstacles.forEach(o => {
                const color = o.type === 'moving' ? '#8B5CF6' : o.type === 'gap' ? '#3B82F6' : '#EF4444';
                ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color + '66';
                if (o.type === 'spike') {
                    ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x, o.y + o.h); ctx.closePath(); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 3); ctx.fill();
                }
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            // Score pops
            scorePops.forEach(s => { ctx.globalAlpha = s.life; ctx.fillStyle = s.color; ctx.font = `bold 14px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(s.text, s.x, s.y); }); ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false; shake(12, 20);
            burst(player.x, player.y, '#EF4444', 25); burst(player.x, player.y, '#F59E0B', 15);
            post('GAMEPLAY', 'GAME_COMPLETE', { score, jumpCount, nearMisses, status: 'loss' });

            setTimeout(() => {
                overlay.style.display = 'flex';
                document.getElementById('title').textContent = 'CRASHED';
                document.getElementById('subtitle').textContent = '';
                const stats = document.getElementById('stats-box'); stats.style.display = 'block';
                document.getElementById('final-score').textContent = score;
                document.getElementById('stat-dist').textContent = `Distance: ${score}`;
                document.getElementById('stat-jumps').textContent = `Jumps: ${jumpCount}`;
                document.getElementById('stat-near').textContent = `Near misses: ${nearMisses}`;
                startBtn.textContent = 'RERUN';
            }, 500);
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
