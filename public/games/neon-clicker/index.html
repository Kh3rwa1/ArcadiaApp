<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Clicker | Arcadia</title>
    <style>
        :root { --void: #000; --accent: #EC4899; --accent2: #F59E0B; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }
        #ui { position: absolute; top: 55px; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        #score { font-size: 48px; font-weight: 900; text-shadow: 0 0 25px var(--accent); }
        #per-sec { font-size: 13px; color: #6B7280; letter-spacing: 3px; margin-top: 2px; }
        #level-badge { position: absolute; top: 140px; width: 100%; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 4px; color: var(--accent); pointer-events: none; z-index: 5; opacity: 0.6; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(236,72,153,0.4); }
        .btn:active { transform: scale(0.96); }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="per-sec">TAP ANYWHERE</div>
    </div>
    <div id="level-badge">LEVEL 1</div>
    <div id="overlay">
        <h1>NEON CLICKER</h1>
        <p>TAP · EVOLVE · DOMINATE</p>
        <button class="btn" id="start-btn">IGNITE</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const perSecEl = document.getElementById('per-sec');
        const levelBadge = document.getElementById('level-badge');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0;
        let score = 0, clickPower = 1, autoRate = 0;
        let level = 1, particles = [], rings = [], pops = [];
        let centerGlow = 0, pulsePhase = 0;
        let lastAutoTick = 0;

        const LEVELS = [
            { threshold: 0, name: 'SPARK', hue: 330, r: 40 },
            { threshold: 50, name: 'EMBER', hue: 20, r: 45 },
            { threshold: 150, name: 'FLAME', hue: 40, r: 50 },
            { threshold: 400, name: 'BLAZE', hue: 330, r: 55 },
            { threshold: 1000, name: 'INFERNO', hue: 280, r: 60 },
            { threshold: 2500, name: 'SUPERNOVA', hue: 200, r: 65 },
            { threshold: 5000, name: 'COSMIC', hue: 160, r: 70 }
        ];

        const UPGRADES = [
            { cost: 25, label: '+1 TAP', apply: () => clickPower++ },
            { cost: 100, label: '+1/s AUTO', apply: () => autoRate++ },
            { cost: 250, label: '+3 TAP', apply: () => clickPower += 3 },
            { cost: 500, label: '+5/s AUTO', apply: () => autoRate += 5 },
            { cost: 1200, label: '+10 TAP', apply: () => clickPower += 10 },
            { cost: 3000, label: '+20/s AUTO', apply: () => autoRate += 20 }
        ];
        let nextUpgrade = 0;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function burst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i; const v = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.03, color, size: 2 + Math.random() * 2 });
            }
        }

        function getCurrentLevel() {
            let l = LEVELS[0];
            for (const lv of LEVELS) { if (score >= lv.threshold) l = lv; }
            return l;
        }

        function handleTap(e) {
            if (!playing) return;
            const t = e.touches ? e.touches[0] : e;
            const mx = t.clientX, my = t.clientY;

            score += clickPower;
            scoreEl.textContent = Math.floor(score);
            centerGlow = 1;

            const lv = getCurrentLevel();
            const color = `hsl(${lv.hue}, 80%, 60%)`;
            burst(mx, my, color, 8);
            rings.push({ x: mx, y: my, r: 5, alpha: 0.6, color });
            pops.push({ x: mx, y: my - 15, text: `+${clickPower}`, life: 1, vy: -2, color: '#fff' });

            // Check upgrades
            if (nextUpgrade < UPGRADES.length && score >= UPGRADES[nextUpgrade].cost) {
                const u = UPGRADES[nextUpgrade];
                u.apply();
                pops.push({ x: W / 2, y: H / 2 + 100, text: u.label, life: 1.5, vy: -1.5, color: '#10B981' });
                burst(W / 2, H / 2, '#10B981', 20);
                nextUpgrade++;
            }

            // Level check
            const newLv = getCurrentLevel();
            const newIdx = LEVELS.indexOf(newLv);
            if (newIdx + 1 > level) {
                level = newIdx + 1;
                levelBadge.textContent = `LEVEL ${level} · ${newLv.name}`;
                burst(W / 2, H / 2, color, 30);
            }

            if (score % 100 < clickPower) post('GAMEPLAY', 'SCORE_UPDATE', { score: Math.floor(score), level });
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive: false });
        window.addEventListener('mousedown', handleTap);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            score = 0; clickPower = 1; autoRate = 0; level = 1; nextUpgrade = 0;
            particles = []; rings = []; pops = []; frame = 0;
            scoreEl.textContent = '0'; levelBadge.textContent = 'LEVEL 1 · SPARK';
            post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;
            pulsePhase += 0.03;

            // Auto clicks
            if (autoRate > 0 && frame % 60 === 0) {
                score += autoRate;
                scoreEl.textContent = Math.floor(score);
            }

            if (autoRate > 0) perSecEl.textContent = `+${autoRate}/s · TAP +${clickPower}`;
            else perSecEl.textContent = `TAP +${clickPower}`;

            // Glow decay
            if (centerGlow > 0) centerGlow = Math.max(0, centerGlow - 0.03);

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = rings.length - 1; i >= 0; i--) { rings[i].r += 3; rings[i].alpha -= 0.02; if (rings[i].alpha <= 0) rings.splice(i, 1); }
            for (let i = pops.length - 1; i >= 0; i--) { pops[i].y += pops[i].vy; pops[i].life -= 0.02; if (pops[i].life <= 0) pops.splice(i, 1); }
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            const lv = getCurrentLevel();
            const hue = lv.hue;

            // Background glow
            const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.5);
            bgGrad.addColorStop(0, `hsla(${hue}, 40%, ${5 + centerGlow * 10}%, 1)`);
            bgGrad.addColorStop(1, '#000');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

            // Central orb
            const orbR = lv.r + Math.sin(pulsePhase) * 5 + centerGlow * 15;
            const orbColor = `hsl(${hue}, 80%, 60%)`;

            // Outer ring
            ctx.strokeStyle = `hsla(${hue}, 60%, 40%, 0.2)`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(W / 2, H / 2, orbR + 30 + Math.sin(pulsePhase * 0.7) * 8, 0, Math.PI * 2); ctx.stroke();

            // Orb glow
            ctx.fillStyle = orbColor;
            ctx.shadowBlur = 40 + centerGlow * 30;
            ctx.shadowColor = orbColor;
            ctx.beginPath(); ctx.arc(W / 2, H / 2, orbR, 0, Math.PI * 2); ctx.fill();

            // Inner highlight
            const innerGrad = ctx.createRadialGradient(W / 2 - orbR * 0.2, H / 2 - orbR * 0.2, 0, W / 2, H / 2, orbR);
            innerGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
            innerGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = innerGrad;
            ctx.beginPath(); ctx.arc(W / 2, H / 2, orbR, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Orbiting dots
            for (let i = 0; i < 3; i++) {
                const oa = pulsePhase * (0.5 + i * 0.3) + i * (Math.PI * 2 / 3);
                const od = orbR + 20;
                const ox = W / 2 + Math.cos(oa) * od;
                const oy = H / 2 + Math.sin(oa) * od;
                ctx.fillStyle = `hsla(${hue}, 70%, 65%, 0.4)`;
                ctx.beginPath(); ctx.arc(ox, oy, 3, 0, Math.PI * 2); ctx.fill();
            }

            // Upgrade progress bar (if next upgrade exists)
            if (nextUpgrade < UPGRADES.length) {
                const u = UPGRADES[nextUpgrade];
                const progress = Math.min(1, score / u.cost);
                const barW = 120, barH = 4;
                const barX = W / 2 - barW / 2, barY = H / 2 + orbR + 60;
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 2); ctx.fill();
                ctx.fillStyle = orbColor;
                ctx.beginPath(); ctx.roundRect(barX, barY, barW * progress, barH, 2); ctx.fill();

                ctx.fillStyle = '#6B7280'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`${u.label} (${u.cost})`, W / 2, barY + 18);
            }

            // Rings
            rings.forEach(r => { ctx.globalAlpha = r.alpha; ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }); ctx.globalAlpha = 1;

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            // Pops
            pops.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.font = `bold ${14 + (1 - p.life) * 4}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); }); ctx.globalAlpha = 1;

            requestAnimationFrame(() => { update(); draw(); });
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
