<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Dash | Arcadia</title>
    <style>
        :root { --void: #030712; --accent: #10B981; --accent2: #3B82F6; }
        body { margin: 0; background: var(--void); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { position: fixed; inset: 0; z-index: 0; }
        #game-ui { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none; }
        #score { position: absolute; top: 55px; font-size: 36px; font-weight: 900; text-shadow: 0 0 20px var(--accent); }
        #streak-bar { position: absolute; top: 100px; font-size: 14px; font-weight: 800; color: #F59E0B; letter-spacing: 4px; opacity: 0; transition: opacity 0.3s; }
        #equation { font-size: 56px; font-weight: 900; margin-bottom: 12px; letter-spacing: -2px; text-shadow: 0 0 30px currentColor; transition: transform 0.1s; }
        #result { font-size: 32px; font-weight: 700; margin-bottom: 32px; color: #9CA3AF; }
        .ans-container { display: flex; gap: 20px; pointer-events: auto; }
        .ans-btn { width: 80px; height: 80px; border-radius: 20px; border: none; font-size: 28px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
        .ans-btn:active { transform: scale(0.92); }
        .ans-btn.wrong-btn { background: #EF4444; color: #fff; box-shadow: 0 4px 0 #B91C1C, 0 0 20px rgba(239,68,68,0.3); }
        .ans-btn.right-btn { background: #10B981; color: #fff; box-shadow: 0 4px 0 #059669, 0 0 20px rgba(16,185,129,0.3); }
        #timer-bar { position: absolute; top: 0; left: 0; height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 100%; z-index: 6; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .start-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(16,185,129,0.4); pointer-events: auto; }
        .start-btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
        #feedback-flash { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.15s; }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div id="feedback-flash"></div>
    <div id="timer-bar"></div>
    <div id="game-ui">
        <div id="score">0</div>
        <div id="streak-bar">🔥 3x STREAK</div>
        <div id="equation">? + ?</div>
        <div id="result">= ?</div>
        <div class="ans-container" id="answers"></div>
    </div>
    <div id="overlay">
        <h1 id="title">MATH DASH</h1>
        <p id="subtitle">SOLVE FAST · STREAK HIGH</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-correct">Correct: 0</div>
            <div class="sm" id="stat-wrong">Wrong: 0</div>
            <div class="sm" id="stat-streak">Best streak: 0</div>
        </div>
        <button class="start-btn" onclick="startGame()">CALCULATE</button>
    </div>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const streakBar = document.getElementById('streak-bar');
        const eqEl = document.getElementById('equation');
        const resultEl = document.getElementById('result');
        const answersEl = document.getElementById('answers');
        const timerEl = document.getElementById('timer-bar');
        const flashEl = document.getElementById('feedback-flash');
        const overlay = document.getElementById('overlay');

        let bgW, bgH, bgParticles = [], bgFrame = 0;
        function resizeBg() { bgW = bgCanvas.width = window.innerWidth; bgH = bgCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeBg); resizeBg();

        for (let i = 0; i < 20; i++) bgParticles.push({ x: Math.random() * bgW, y: Math.random() * bgH, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, char: '+-×÷='[Math.floor(Math.random() * 5)], alpha: 0.06 + Math.random() * 0.06 });

        let score = 0, playing = false, correct = 0, wrong = 0, streak = 0, bestStreak = 0;
        let correctAnswer, timerLoop, lives = 3;

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'READY');

        function flash(color) { flashEl.style.background = color; flashEl.style.opacity = '0.3'; setTimeout(() => flashEl.style.opacity = '0', 200); }

        function generateProblem() {
            const ops = ['+', '-', '×'];
            if (score > 200) ops.push('÷');
            const op = ops[Math.floor(Math.random() * ops.length)];
            const maxNum = Math.min(50, 10 + Math.floor(score / 30));
            let a, b, answer;

            if (op === '+') { a = Math.floor(Math.random() * maxNum) + 1; b = Math.floor(Math.random() * maxNum) + 1; answer = a + b; }
            else if (op === '-') { a = Math.floor(Math.random() * maxNum) + 2; b = Math.floor(Math.random() * a) + 1; answer = a - b; }
            else if (op === '×') { a = Math.floor(Math.random() * 12) + 1; b = Math.floor(Math.random() * 12) + 1; answer = a * b; }
            else { b = Math.floor(Math.random() * 12) + 1; answer = Math.floor(Math.random() * 12) + 1; a = b * answer; }

            correctAnswer = answer;
            eqEl.textContent = `${a} ${op} ${b}`;
            eqEl.style.transform = 'scale(1.1)';
            setTimeout(() => eqEl.style.transform = '', 150);
            resultEl.textContent = `= ?`;

            // Generate answer buttons
            const answers = [answer];
            while (answers.length < 4) {
                const fake = answer + Math.floor(Math.random() * 20) - 10;
                if (fake !== answer && fake >= 0 && !answers.includes(fake)) answers.push(fake);
            }
            // Shuffle
            for (let i = answers.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [answers[i], answers[j]] = [answers[j], answers[i]]; }

            answersEl.innerHTML = '';
            answers.forEach(a => {
                const btn = document.createElement('button');
                btn.className = 'ans-btn ' + (a === correctAnswer ? 'right-btn' : 'wrong-btn');
                btn.style.background = '#1E293B';
                btn.style.color = '#fff';
                btn.style.boxShadow = '0 4px 0 #0F172A';
                btn.textContent = a;
                btn.onclick = () => handleAnswer(a);
                answersEl.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            cancelAnimationFrame(timerLoop);
            const duration = Math.max(1500, 4000 - score * 6);
            const start = performance.now();
            function tick(time) {
                if (!playing) return;
                const remaining = Math.max(0, 1 - (time - start) / duration);
                timerEl.style.width = (remaining * 100) + '%';
                timerEl.style.background = remaining < 0.3 ? 'linear-gradient(90deg, #EF4444, #F97316)' : 'linear-gradient(90deg, var(--accent), var(--accent2))';
                if (remaining <= 0) { handleAnswer(null); return; }
                timerLoop = requestAnimationFrame(tick);
            }
            timerLoop = requestAnimationFrame(tick);
        }

        function handleAnswer(answer) {
            if (!playing) return;
            if (answer === correctAnswer) {
                correct++; streak++;
                if (streak > bestStreak) bestStreak = streak;
                const mult = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
                score += 10 * mult;
                scoreEl.textContent = score;
                flash('rgba(16,185,129,0.4)');
                resultEl.textContent = `= ${correctAnswer} ✓`;
                resultEl.style.color = '#10B981';
                streakBar.style.opacity = streak >= 3 ? '1' : '0';
                streakBar.textContent = `🔥 ${streak}x STREAK`;
                post('GAMEPLAY', 'SCORE_UPDATE', { score, streak });
            } else {
                wrong++; streak = 0; lives--;
                streakBar.style.opacity = '0';
                flash('rgba(239,68,68,0.4)');
                resultEl.textContent = `= ${correctAnswer} ✗`;
                resultEl.style.color = '#EF4444';
                eqEl.style.transform = 'translateX(8px)';
                setTimeout(() => { eqEl.style.transform = 'translateX(-8px)'; }, 50);
                setTimeout(() => { eqEl.style.transform = ''; }, 120);
                if (lives <= 0) { gameOver(); return; }
            }
            setTimeout(() => { resultEl.style.color = '#9CA3AF'; generateProblem(); }, 500);
        }

        function startGame() {
            playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; correct = 0; wrong = 0; streak = 0; bestStreak = 0; lives = 3;
            scoreEl.textContent = '0';
            generateProblem();
            post('GAMEPLAY', 'GAME_START');
        }

        function gameOver() {
            playing = false; cancelAnimationFrame(timerLoop);
            post('GAMEPLAY', 'GAME_COMPLETE', { score, correct, wrong, bestStreak, status: 'loss' });
            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'TIMES UP';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box'); stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-correct').textContent = `Correct: ${correct}`;
            document.getElementById('stat-wrong').textContent = `Wrong: ${wrong}`;
            document.getElementById('stat-streak').textContent = `Best streak: ${bestStreak}x`;
            document.querySelector('.start-btn').textContent = 'RETRY';
        }

        function drawBg() {
            bgFrame++;
            bgCtx.fillStyle = 'rgba(3,7,18,0.15)';
            bgCtx.fillRect(0, 0, bgW, bgH);
            bgParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = bgW; if (p.x > bgW) p.x = 0;
                if (p.y < 0) p.y = bgH; if (p.y > bgH) p.y = 0;
                bgCtx.globalAlpha = p.alpha;
                bgCtx.fillStyle = '#10B981';
                bgCtx.font = '18px Inter, sans-serif';
                bgCtx.fillText(p.char, p.x, p.y);
            });
            bgCtx.globalAlpha = 1;
            requestAnimationFrame(drawBg);
        }
        drawBg();
    </script>
</body>

</html>
