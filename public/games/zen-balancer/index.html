<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zen Balancer | Arcadia</title>
    <style>
        :root {
            --void: #030712;
            --accent: #06B6D4;
            --accent2: #10B981;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 0 25px var(--accent);
        }

        #timer {
            font-size: 14px;
            color: #6B7280;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        #shield-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            pointer-events: none;
        }

        #shield-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 3px;
            transition: width 0.3s;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        #overlay h1 {
            font-size: 44px;
            font-weight: 900;
            margin: 0 0 6px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; font-size: 14px; }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #000;
            padding: 18px 56px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.4);
        }

        .btn:active { transform: scale(0.96); }

        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="timer">00:00</div>
    </div>
    <div id="shield-bar"><div id="shield-fill"></div></div>
    <div id="overlay">
        <h1 id="title">ZEN BALANCER</h1>
        <p id="subtitle">NAVIGATE THE CALM · AVOID THE CHAOS</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-time">Survived: 0s</div>
            <div class="sm" id="stat-orbs">Orbs collected: 0</div>
            <div class="sm" id="stat-dodges">Hazards dodged: 0</div>
        </div>
        <button class="btn" id="start-btn">BALANCE</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const shieldFill = document.getElementById('shield-fill');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0;
        let score = 0, orbsCollected = 0, hazardsDodged = 0;
        let startTime = 0, shield = 0, shieldActive = false;
        let playerX = 0.5, playerY = 0.5, targetX = 0.5, targetY = 0.5;
        let hazards = [], collectibles = [], particles = [], trail = [], milestones = [];
        let shakeX = 0, shakeY = 0, shakeDur = 0;
        let bgHue = 180;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function shake(intensity, dur) { shakeDur = dur; shakeX = (Math.random() - 0.5) * intensity; shakeY = (Math.random() - 0.5) * intensity; }

        function burst(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const vel = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel, life: 1, decay: 0.025, color, size: 2 + Math.random() * 3 });
            }
        }

        const handleMove = (e) => {
            const t = e.touches ? e.touches[0] : e;
            targetX = t.clientX / W;
            targetY = t.clientY / H;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchstart', handleMove);

        function spawnHazard() {
            const types = ['circle', 'rect', 'line', 'ring'];
            const type = types[Math.floor(Math.random() * types.length)];
            const elapsed = (Date.now() - startTime) / 1000;
            const x = Math.random();
            const y = Math.random();
            const spd = 0.7 + elapsed / 60 + Math.random() * 0.3;
            hazards.push({
                x, y, type,
                phase: 0,
                warningFrames: 40 - Math.min(15, elapsed / 5),
                maxPhase: 70 + Math.random() * 30,
                speed: spd,
                hue: 0 + Math.random() * 30
            });
        }

        function spawnCollectible() {
            collectibles.push({
                x: 0.1 + Math.random() * 0.8,
                y: 0.1 + Math.random() * 0.8,
                type: Math.random() < 0.3 ? 'shield' : 'orb',
                pulse: 0,
                born: Date.now(),
                lifeSpan: 5
            });
        }

        startBtn.onclick = (e) => {
            e.stopPropagation();
            playing = true;
            overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; orbsCollected = 0; hazardsDodged = 0;
            shield = 0; shieldActive = false;
            playerX = 0.5; playerY = 0.5; targetX = 0.5; targetY = 0.5;
            hazards = []; collectibles = []; particles = []; trail = []; milestones = [];
            startTime = Date.now(); frame = 0;
            post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;

            const elapsed = (Date.now() - startTime) / 1000;
            const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const s = String(Math.floor(elapsed % 60)).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;

            // Smooth player movement
            playerX += (targetX - playerX) * 0.1;
            playerY += (targetY - playerY) * 0.1;

            // Trail
            trail.push({ x: playerX * W, y: playerY * H, alpha: 1 });
            if (trail.length > 18) trail.shift();
            trail.forEach(t => t.alpha -= 0.055);

            // Background hue drift
            bgHue = 180 + Math.sin(elapsed * 0.1) * 30;

            // Spawn hazards
            const spawnRate = Math.max(8, 30 - Math.floor(elapsed / 3));
            if (frame % spawnRate === 0) spawnHazard();

            // Spawn collectibles
            if (frame % 120 === 0) spawnCollectible();

            // Shield decay
            if (shield > 0) shield = Math.max(0, shield - 0.002);
            shieldFill.style.width = (shield * 100) + '%';
            shieldActive = shield > 0;

            // Check milestones
            [15, 30, 45, 60, 90, 120].forEach(ms => {
                if (elapsed >= ms && !milestones.includes(ms)) {
                    milestones.push(ms);
                    score += ms * 2;
                    burst(playerX * W, playerY * H, '#06B6D4', 25);
                }
            });

            // Update hazards
            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                h.phase += h.speed;

                if (h.phase > h.warningFrames) {
                    // Collision check
                    const px = playerX, py = playerY;
                    const danger = h.phase - h.warningFrames;
                    let hit = false;
                    const pr = 0.022;

                    if (h.type === 'circle') {
                        const r = danger * 0.007;
                        if (Math.hypot(px - h.x, py - h.y) < r + pr) hit = true;
                    } else if (h.type === 'rect') {
                        const half = danger * 0.005;
                        if (Math.abs(px - h.x) < half + pr && Math.abs(py - h.y) < half + pr) hit = true;
                    } else if (h.type === 'line') {
                        const half = danger * 0.007;
                        if (Math.abs(py - h.y) < pr + 0.012 && Math.abs(px - h.x) < half + pr) hit = true;
                    } else if (h.type === 'ring') {
                        const r = danger * 0.006;
                        const d = Math.hypot(px - h.x, py - h.y);
                        if (Math.abs(d - r) < pr + 0.015) hit = true;
                    }

                    if (hit) {
                        if (shieldActive) {
                            shield = 0;
                            shieldActive = false;
                            shake(6, 8);
                            burst(playerX * W, playerY * H, '#06B6D4', 12);
                            hazards.splice(i, 1);
                            continue;
                        }
                        gameOver();
                        return;
                    }
                }

                if (h.phase > h.maxPhase) {
                    hazardsDodged++;
                    score += 5;
                    scoreEl.textContent = score;
                    if (frame % 120 === 0) post('GAMEPLAY', 'SCORE_UPDATE', { score });
                    hazards.splice(i, 1);
                }
            }

            // Collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                c.pulse = Math.sin((Date.now() - c.born) * 0.005) * 0.15;
                const age = (Date.now() - c.born) / 1000;

                // Check pickup
                const dist = Math.hypot(playerX - c.x, playerY - c.y);
                if (dist < 0.04) {
                    if (c.type === 'shield') {
                        shield = Math.min(1, shield + 0.5);
                        burst(c.x * W, c.y * H, '#06B6D4', 15);
                    } else {
                        score += 25;
                        orbsCollected++;
                        burst(c.x * W, c.y * H, '#10B981', 15);
                    }
                    scoreEl.textContent = score;
                    collectibles.splice(i, 1);
                    continue;
                }

                if (age > c.lifeSpan) collectibles.splice(i, 1);
            }

            // Shake / particles
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            ctx.translate(shakeX, shakeY);

            // Background gradient
            const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
            bgGrad.addColorStop(0, `hsla(${bgHue}, 40%, 8%, 1)`);
            bgGrad.addColorStop(1, '#030712');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(-5, -5, W + 10, H + 10);

            // Ambient aurora effect
            ctx.globalAlpha = 0.08;
            const auroraGrad = ctx.createRadialGradient(W * 0.3, H * 0.3, 0, W * 0.3, H * 0.3, W * 0.4);
            auroraGrad.addColorStop(0, `hsla(${bgHue + 40}, 60%, 50%, 1)`);
            auroraGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = auroraGrad;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;

            // Hazards
            hazards.forEach(h => {
                const danger = Math.max(0, h.phase - h.warningFrames);
                const warning = h.phase <= h.warningFrames;
                const progress = h.phase / h.warningFrames;
                const alpha = warning ? 0.1 + progress * 0.25 : 0.3 + danger * 0.004;

                ctx.globalAlpha = Math.min(0.75, alpha);

                if (h.type === 'circle') {
                    const r = warning ? 6 + progress * 8 : danger * 0.007 * Math.max(W, H);
                    ctx.fillStyle = warning ? '#FCA5A5' : '#EF4444';
                    ctx.shadowBlur = warning ? 0 : 15;
                    ctx.shadowColor = '#EF4444';
                    ctx.beginPath(); ctx.arc(h.x * W, h.y * H, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (h.type === 'rect') {
                    const half = warning ? 6 : danger * 0.005 * Math.max(W, H);
                    ctx.fillStyle = warning ? '#FCA5A5' : '#EF4444';
                    ctx.beginPath();
                    ctx.roundRect(h.x * W - half, h.y * H - half, half * 2, half * 2, 4);
                    ctx.fill();
                } else if (h.type === 'line') {
                    const half = warning ? 10 : danger * 0.007 * W;
                    ctx.fillStyle = warning ? '#FCA5A5' : '#EF4444';
                    ctx.fillRect(h.x * W - half, h.y * H - 3, half * 2, 6);
                } else if (h.type === 'ring') {
                    const r = warning ? 5 : danger * 0.006 * Math.max(W, H);
                    ctx.strokeStyle = warning ? '#FCA5A5' : '#EF4444';
                    ctx.lineWidth = warning ? 2 : 4;
                    ctx.beginPath(); ctx.arc(h.x * W, h.y * H, r, 0, Math.PI * 2); ctx.stroke();
                }
            });
            ctx.globalAlpha = 1;

            // Warning crosshairs for upcoming hazards
            hazards.forEach(h => {
                if (h.phase < h.warningFrames * 0.5) {
                    ctx.globalAlpha = 0.15;
                    ctx.strokeStyle = '#FCA5A5';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 6]);
                    // Crosshair
                    ctx.beginPath(); ctx.moveTo(h.x * W - 12, h.y * H); ctx.lineTo(h.x * W + 12, h.y * H); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(h.x * W, h.y * H - 12); ctx.lineTo(h.x * W, h.y * H + 12); ctx.stroke();
                    ctx.setLineDash([]);
                }
            });
            ctx.globalAlpha = 1;

            // Collectibles
            collectibles.forEach(c => {
                const age = (Date.now() - c.born) / 1000;
                const scale = 1 + c.pulse;
                const r = 10 * scale;
                const color = c.type === 'shield' ? '#06B6D4' : '#10B981';

                ctx.fillStyle = color;
                ctx.shadowBlur = 20; ctx.shadowColor = color;
                ctx.beginPath(); ctx.arc(c.x * W, c.y * H, r, 0, Math.PI * 2); ctx.fill();

                // Fading ring
                const lifeRatio = 1 - age / c.lifeSpan;
                ctx.strokeStyle = color;
                ctx.globalAlpha = lifeRatio * 0.4;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(c.x * W, c.y * H, r + lifeRatio * 15, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 1;

                // Icon
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c.type === 'shield' ? '◆' : '●', c.x * W, c.y * H);
                ctx.shadowBlur = 0;
            });

            // Player trail
            trail.forEach(t => {
                if (t.alpha <= 0) return;
                ctx.globalAlpha = t.alpha * 0.25;
                ctx.fillStyle = shieldActive ? '#06B6D4' : '#fff';
                ctx.beginPath(); ctx.arc(t.x, t.y, 5 * t.alpha, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Player orb
            const px = playerX * W, py = playerY * H;
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 30;
            ctx.shadowColor = shieldActive ? '#06B6D4' : '#fff';
            ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fill();

            // Inner glow
            ctx.fillStyle = shieldActive ? 'rgba(6, 182, 212, 0.6)' : 'rgba(255,255,255,0.4)';
            ctx.beginPath(); ctx.arc(px - 2, py - 2, 5, 0, Math.PI * 2); ctx.fill();

            // Shield ring
            if (shieldActive) {
                const pulseR = 18 + Math.sin(frame * 0.1) * 3;
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(px, py, pulseR, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            shake(15, 20);
            burst(playerX * W, playerY * H, '#EF4444', 30);
            burst(playerX * W, playerY * H, '#fff', 15);

            post('GAMEPLAY', 'GAME_COMPLETE', { score, survival: elapsed, orbs: orbsCollected, status: 'loss' });

            setTimeout(() => {
                overlay.style.display = 'flex';
                document.getElementById('title').textContent = 'DISRUPTED';
                document.getElementById('subtitle').textContent = '';
                const stats = document.getElementById('stats-box');
                stats.style.display = 'block';
                document.getElementById('final-score').textContent = score;
                document.getElementById('stat-time').textContent = `Survived: ${elapsed}s`;
                document.getElementById('stat-orbs').textContent = `Orbs collected: ${orbsCollected}`;
                document.getElementById('stat-dodges').textContent = `Hazards dodged: ${hazardsDodged}`;
                startBtn.textContent = 'REBALANCE';
            }, 500);
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
