<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memory Flip | Arcadia</title>
    <style>
        :root {
            --void: #030712;
            --accent: #8B5CF6;
            --accent2: #EC4899;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 36px;
            font-weight: 900;
            text-shadow: 0 0 20px var(--accent);
        }

        #level-info {
            font-size: 13px;
            color: #9CA3AF;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        #timer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.3s linear;
            box-shadow: 0 0 12px var(--accent);
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        #overlay h1 {
            font-size: 44px;
            font-weight: 900;
            margin: 0 0 6px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; font-size: 14px; }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            padding: 18px 56px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.4);
        }

        .btn:active { transform: scale(0.96); }

        #stats-box {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
        #stars-display { font-size: 36px; margin-bottom: 8px; }

        #moves-display {
            position: absolute;
            top: 40px;
            right: 20px;
            font-size: 14px;
            color: #6B7280;
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 15px var(--accent);
        }
    </style>
</head>

<body>
    <div id="timer-bar" style="width:100%"></div>
    <div id="ui">
        <div id="score">0</div>
        <div id="level-info">LEVEL 1</div>
    </div>
    <div id="moves-display">Moves: 0</div>
    <div id="combo-display">2x COMBO!</div>
    <div id="overlay">
        <h1 id="title">MEMORY FLIP</h1>
        <p id="subtitle">MATCH THE HIDDEN PAIRS</p>
        <div id="stats-box">
            <div id="stars-display"></div>
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-moves">Moves: 0</div>
            <div class="sm" id="stat-time">Time: 0s</div>
            <div class="sm" id="stat-combo">Best combo: 0</div>
        </div>
        <button class="btn" id="start-btn">FLIP</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level-info');
        const timerBar = document.getElementById('timer-bar');
        const movesEl = document.getElementById('moves-display');
        const comboEl = document.getElementById('combo-display');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H;
        let playing = false, score = 0, level = 1, moves = 0;
        let cards = [], flipped = [], matched = 0;
        let combo = 0, bestCombo = 0, consecutiveMatches = 0;
        let timerStart = 0, timerDuration = 60000, timeLeft = 1;
        let particles = [], shakeX = 0, shakeY = 0, shakeDur = 0;
        let lockInput = false;
        let gridCols, gridRows, cardW, cardH, gridX, gridY, cardGap;

        // Card symbols with colors
        const SYMBOLS = [
            { icon: '🎮', color: '#EF4444' }, { icon: '🚀', color: '#3B82F6' },
            { icon: '⭐', color: '#F59E0B' }, { icon: '🎯', color: '#10B981' },
            { icon: '💎', color: '#8B5CF6' }, { icon: '🔥', color: '#F97316' },
            { icon: '⚡', color: '#FBBF24' }, { icon: '🌀', color: '#06B6D4' },
            { icon: '🎪', color: '#EC4899' }, { icon: '🏆', color: '#84CC16' },
            { icon: '🎵', color: '#A78BFA' }, { icon: '🌟', color: '#FCD34D' },
            { icon: '🎲', color: '#F472B6' }, { icon: '🔮', color: '#818CF8' },
            { icon: '🎭', color: '#FB923C' }
        ];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            layoutGrid();
        }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function layoutGrid() {
            if (level <= 2) { gridCols = 4; gridRows = 3; }
            else if (level <= 4) { gridCols = 4; gridRows = 4; }
            else { gridCols = 5; gridRows = 4; }

            const totalPairs = (gridCols * gridRows) / 2;
            cardGap = 10;
            const maxCardW = (W - 40 - (gridCols - 1) * cardGap) / gridCols;
            const maxCardH = (H - 200 - (gridRows - 1) * cardGap) / gridRows;
            cardW = Math.min(maxCardW, 85);
            cardH = Math.min(maxCardH, 100);

            const totalW = gridCols * cardW + (gridCols - 1) * cardGap;
            const totalH = gridRows * cardH + (gridRows - 1) * cardGap;
            gridX = (W - totalW) / 2;
            gridY = (H - totalH) / 2 + 20;
        }

        function createCards() {
            const count = gridCols * gridRows;
            const numPairs = count / 2;
            const selected = SYMBOLS.slice(0, numPairs);
            const deck = [...selected, ...selected];

            // Fisher-Yates shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            cards = deck.map((sym, i) => ({
                icon: sym.icon,
                color: sym.color,
                col: i % gridCols,
                row: Math.floor(i / gridCols),
                flipped: false,
                matched: false,
                flipAnim: 0,    // 0 = face down, 1 = face up
                flipDir: 0,     // 1 = flipping up, -1 = flipping down
                matchAnim: 0,
                shakeAnim: 0
            }));
        }

        function shake(intensity, dur) { shakeDur = dur; shakeX = (Math.random() - 0.5) * intensity; shakeY = (Math.random() - 0.5) * intensity; }

        function burst(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const vel = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel, life: 1, decay: 0.025, color, size: 3 + Math.random() * 3 });
            }
        }

        function getCardRect(card) {
            return {
                x: gridX + card.col * (cardW + cardGap),
                y: gridY + card.row * (cardH + cardGap),
                w: cardW, h: cardH
            };
        }

        function handleTap(e) {
            if (!playing || lockInput) return;
            const t = e.touches ? e.touches[0] : e;
            const mx = t.clientX, my = t.clientY;

            for (const card of cards) {
                if (card.flipped || card.matched) continue;
                const r = getCardRect(card);
                if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
                    // Flip this card
                    card.flipped = true;
                    card.flipDir = 1;
                    flipped.push(card);

                    if (flipped.length === 2) {
                        moves++;
                        movesEl.textContent = `Moves: ${moves}`;
                        lockInput = true;

                        setTimeout(() => {
                            if (flipped[0].icon === flipped[1].icon) {
                                // Match!
                                flipped[0].matched = true;
                                flipped[1].matched = true;
                                flipped[0].matchAnim = 1;
                                flipped[1].matchAnim = 1;
                                matched += 2;
                                consecutiveMatches++;
                                combo = consecutiveMatches;
                                if (combo > bestCombo) bestCombo = combo;

                                const matchScore = 100 + (combo > 1 ? combo * 50 : 0);
                                score += matchScore;
                                scoreEl.textContent = score;

                                const r0 = getCardRect(flipped[0]);
                                const r1 = getCardRect(flipped[1]);
                                burst(r0.x + r0.w / 2, r0.y + r0.h / 2, flipped[0].color, 20);
                                burst(r1.x + r1.w / 2, r1.y + r1.h / 2, flipped[1].color, 20);

                                if (combo >= 2) {
                                    comboEl.textContent = `${combo}x COMBO! +${matchScore}`;
                                    comboEl.style.opacity = '1';
                                    setTimeout(() => comboEl.style.opacity = '0', 1200);
                                }

                                post('GAMEPLAY', 'SCORE_UPDATE', { score, level, matched });

                                // Check level complete
                                if (matched >= cards.length) {
                                    setTimeout(() => levelComplete(), 500);
                                }
                            } else {
                                // Mismatch
                                consecutiveMatches = 0;
                                flipped[0].flipDir = -1;
                                flipped[1].flipDir = -1;
                                flipped[0].shakeAnim = 1;
                                flipped[1].shakeAnim = 1;
                                shake(5, 8);

                                setTimeout(() => {
                                    flipped[0].flipped = false;
                                    flipped[1].flipped = false;
                                }, 150);
                            }
                            flipped = [];
                            lockInput = false;
                        }, 500);
                    }
                    break;
                }
            }
        }

        window.addEventListener('touchstart', handleTap);
        window.addEventListener('mousedown', handleTap);

        function startGame() {
            playing = true;
            overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; level = 1; moves = 0; matched = 0;
            combo = 0; bestCombo = 0; consecutiveMatches = 0;
            particles = []; flipped = []; lockInput = false;
            scoreEl.textContent = '0';
            movesEl.textContent = 'Moves: 0';
            levelEl.textContent = 'LEVEL 1';
            layoutGrid();
            createCards();
            timerDuration = 60000;
            timerStart = Date.now();
            post('GAMEPLAY', 'GAME_START');
        }

        function levelComplete() {
            level++;
            matched = 0;
            flipped = [];
            lockInput = false;
            consecutiveMatches = 0;
            layoutGrid();
            createCards();
            timerDuration = Math.max(30000, 65000 - level * 5000);
            timerStart = Date.now();
            levelEl.textContent = `LEVEL ${level}`;

            // Bonus for level clear
            const timeBonus = Math.floor(timeLeft * 500);
            score += timeBonus + 200;
            scoreEl.textContent = score;
        }

        startBtn.onclick = (e) => { e.stopPropagation(); startGame(); };

        function gameOver() {
            playing = false;
            const elapsed = Math.floor((Date.now() - timerStart) / 1000);
            post('GAMEPLAY', 'GAME_COMPLETE', { score, level, moves, status: 'loss' });

            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'TIME UP';
            document.getElementById('subtitle').textContent = '';

            const stars = level > 3 ? '⭐⭐⭐' : level > 1 ? '⭐⭐' : '⭐';
            const stats = document.getElementById('stats-box');
            stats.style.display = 'block';
            document.getElementById('stars-display').textContent = stars;
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-moves').textContent = `Moves: ${moves}`;
            document.getElementById('stat-time').textContent = `Level reached: ${level}`;
            document.getElementById('stat-combo').textContent = `Best combo: ${bestCombo}x`;
            startBtn.textContent = 'RETRY';
        }

        function update() {
            if (!playing) return;

            // Timer
            const elapsed = Date.now() - timerStart;
            timeLeft = Math.max(0, 1 - elapsed / timerDuration);
            timerBar.style.width = (timeLeft * 100) + '%';

            if (timeLeft <= 0.3) {
                timerBar.style.background = 'linear-gradient(90deg, #EF4444, #F97316)';
            } else {
                timerBar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';
            }

            if (timeLeft <= 0) { gameOver(); return; }

            // Animate cards
            cards.forEach(c => {
                if (c.flipDir > 0 && c.flipAnim < 1) c.flipAnim = Math.min(1, c.flipAnim + 0.12);
                if (c.flipDir < 0 && c.flipAnim > 0) c.flipAnim = Math.max(0, c.flipAnim - 0.12);
                if (c.flipAnim <= 0 && c.flipDir < 0) c.flipDir = 0;
                if (c.matchAnim > 0) c.matchAnim = Math.max(0, c.matchAnim - 0.03);
                if (c.shakeAnim > 0) c.shakeAnim = Math.max(0, c.shakeAnim - 0.06);
            });

            // Particles / shake
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            ctx.translate(shakeX, shakeY);
            ctx.fillStyle = '#030712';
            ctx.fillRect(-5, -5, W + 10, H + 10);

            // Background ambient glow
            const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
            bgGrad.addColorStop(0, 'rgba(139, 92, 246, 0.06)');
            bgGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Cards
            cards.forEach(c => {
                const r = getCardRect(c);
                const cx = r.x + r.w / 2;
                const cy = r.y + r.h / 2;
                const flipProgress = c.flipAnim;
                const scaleX = Math.abs(Math.cos(flipProgress * Math.PI));
                const shakeOff = c.shakeAnim * Math.sin(c.shakeAnim * 20) * 5;

                ctx.save();
                ctx.translate(cx + shakeOff, cy);
                ctx.scale(scaleX || 0.01, 1);

                if (flipProgress > 0.5 || c.matched) {
                    // Face up
                    const grad = ctx.createLinearGradient(-r.w / 2, -r.h / 2, r.w / 2, r.h / 2);
                    grad.addColorStop(0, c.color + '33');
                    grad.addColorStop(1, c.color + '11');
                    ctx.fillStyle = grad;

                    if (c.matched) {
                        ctx.shadowBlur = 15 + c.matchAnim * 25;
                        ctx.shadowColor = c.color;
                    }

                    ctx.beginPath();
                    ctx.roundRect(-r.w / 2, -r.h / 2, r.w, r.h, 12);
                    ctx.fill();
                    ctx.strokeStyle = c.color + '66';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // Emoji
                    ctx.font = `${Math.min(r.w, r.h) * 0.45}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(c.icon, 0, 2);

                    if (c.matched) {
                        ctx.globalAlpha = 0.15 + c.matchAnim * 0.3;
                        ctx.fillStyle = c.color;
                        ctx.beginPath();
                        ctx.roundRect(-r.w / 2, -r.h / 2, r.w, r.h, 12);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                } else {
                    // Face down
                    const grad = ctx.createLinearGradient(-r.w / 2, -r.h / 2, r.w / 2, r.h / 2);
                    grad.addColorStop(0, '#1E293B');
                    grad.addColorStop(1, '#0F172A');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(-r.w / 2, -r.h / 2, r.w, r.h, 12);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Center diamond pattern
                    ctx.fillStyle = 'rgba(139, 92, 246, 0.08)';
                    ctx.save();
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-10, -10, 20, 20);
                    ctx.restore();
                }

                ctx.restore();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
