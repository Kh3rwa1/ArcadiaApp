<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Cascade | Arcadia</title>
    <style>
        :root {
            --void: #000;
            --accent: #F59E0B;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 20px var(--accent);
        }

        #combo {
            font-size: 18px;
            opacity: 0.6;
            margin-top: 4px;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 44px;
            font-weight: 900;
            margin: 0 0 4px;
            letter-spacing: -2px;
        }

        #overlay p {
            color: #9CA3AF;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 18px 52px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="combo"></div>
    </div>
    <div id="overlay">
        <h1>EMOJI CASCADE</h1>
        <p>CATCH THE FALLING EMOJIS</p>
        <button class="btn" id="start-btn">BEGIN</button>
    </div>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, combo = 0, lives = 3, frame = 0;
        let emojis = [], particles = [], catcherX = 0;
        const EMOJIS = ['🍎', '🍊', '🍋', '🍇', '🍓', '⭐', '💎', '🔥', '🎯', '🌈'];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; catcherX = W / 2; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        startBtn.onclick = (e) => { e.stopPropagation(); playing = true; overlay.style.display = 'none'; score = 0; combo = 0; lives = 3; emojis = []; particles = []; post('GAMEPLAY', 'GAME_START'); };

        const handleMove = (e) => { const t = e.touches ? e.touches[0] : e; catcherX = t.clientX; };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchstart', handleMove);

        function spawnEmoji() {
            emojis.push({ x: Math.random() * (W - 40) + 20, y: -30, emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)], speed: 2 + Math.random() * 2 + score / 500, size: 28 + Math.random() * 8 });
        }

        function burstParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color });
            }
        }

        function update() {
            if (!playing) return;
            frame++;
            if (frame % Math.max(15, 40 - Math.floor(score / 50)) === 0) spawnEmoji();

            emojis.forEach((e, i) => {
                e.y += e.speed;
                const dx = Math.abs(e.x - catcherX);
                if (e.y > H - 80 && dx < 50) {
                    score += 10 + combo * 2; combo++;
                    burstParticles(e.x, e.y, '#F59E0B');
                    emojis.splice(i, 1);
                    scoreEl.innerText = score;
                    comboEl.innerText = combo > 1 ? `${combo}x COMBO!` : '';
                    post('GAMEPLAY', 'SCORE_UPDATE', { score, combo });
                } else if (e.y > H + 20) {
                    emojis.splice(i, 1); combo = 0; lives--;
                    comboEl.innerText = '';
                    if (lives <= 0) gameOver();
                }
            });

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; if (p.life <= 0) particles.splice(i, 1); });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            // Ambient glow
            const grd = ctx.createRadialGradient(catcherX, H - 60, 10, catcherX, H - 60, 200);
            grd.addColorStop(0, 'rgba(245,158,11,0.15)'); grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

            // Catcher
            ctx.fillStyle = '#F59E0B'; ctx.shadowBlur = 20; ctx.shadowColor = '#F59E0B';
            ctx.beginPath(); ctx.roundRect(catcherX - 40, H - 70, 80, 16, 8); ctx.fill();
            ctx.shadowBlur = 0;

            // Lives
            ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
            for (let i = 0; i < lives; i++) ctx.fillText('❤️', 16 + i * 28, 36);

            // Emojis
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            emojis.forEach(e => { ctx.font = `${e.size}px sans-serif`; ctx.fillText(e.emoji, e.x, e.y); });

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1;

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post('GAMEPLAY', 'GAME_COMPLETE', { score, status: 'loss' });
            overlay.style.display = 'flex';
            overlay.querySelector('h1').innerText = 'CASCADE OVER';
            overlay.querySelector('p').innerText = `SCORE: ${score}`;
            startBtn.innerText = 'RETRY';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
