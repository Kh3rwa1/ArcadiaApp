<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Jump | Arcadia</title>
    <style>
        :root {
            --void: #000;
            --accent: #3B82F6;
            --accent2: #8B5CF6;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui {
            position: absolute;
            top: 50px;
            left: 24px;
            pointer-events: none;
        }

        #score {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 0 25px var(--accent);
        }

        #multiplier {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        #overlay h1 {
            font-size: 48px;
            font-weight: 900;
            margin: 0 0 4px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #overlay p {
            color: #9CA3AF;
            margin-bottom: 36px;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            padding: 18px 56px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:active { transform: scale(0.96); box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }

        #final-stats {
            text-align: center;
            margin-bottom: 24px;
            display: none;
        }

        #final-stats .stat {
            font-size: 14px;
            color: #9CA3AF;
            margin: 4px 0;
        }

        #final-stats .big-score {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">000</div>
        <div id="multiplier">x2 COMBO</div>
    </div>
    <div id="overlay">
        <h1 id="title">GRAVITY JUMP</h1>
        <p id="subtitle">TAP TO DEFY GRAVITY</p>
        <div id="final-stats">
            <div class="big-score" id="final-score">0</div>
            <div class="stat" id="stat-distance">Distance: 0m</div>
            <div class="stat" id="stat-jumps">Jumps: 0</div>
            <div class="stat" id="stat-close">Near misses: 0</div>
        </div>
        <button class="btn" id="start-btn">LAUNCH</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const multiplierEl = document.getElementById('multiplier');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0;
        let score = 0, jumps = 0, nearMisses = 0;
        let player, obstacles, particles, stars, bgStars, shakeX, shakeY, shakeDur;
        let speed, groundY, combo, comboTimer;
        let doubleJumpAvailable;
        let scorePops = [];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; groundY = H * 0.78; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        // Parallax star layers
        function initStars() {
            bgStars = [];
            for (let layer = 0; layer < 3; layer++) {
                for (let i = 0; i < 30; i++) {
                    bgStars.push({
                        x: Math.random() * W, y: Math.random() * H * 0.75,
                        s: Math.random() * (layer + 1) + 0.5,
                        v: (layer + 1) * 0.3, alpha: 0.2 + layer * 0.15,
                        layer
                    });
                }
            }
        }

        function initGame() {
            player = { x: W * 0.18, y: groundY, vy: 0, r: 16, grounded: true, trail: [] };
            obstacles = [];
            particles = [];
            scorePops = [];
            score = 0; jumps = 0; nearMisses = 0;
            speed = 3.5; combo = 0; comboTimer = 0;
            shakeX = 0; shakeY = 0; shakeDur = 0;
            doubleJumpAvailable = true;
            frame = 0;
            initStars();
        }

        function shake(intensity, duration) { shakeDur = duration; shakeX = (Math.random() - 0.5) * intensity; shakeY = (Math.random() - 0.5) * intensity; }

        function burst(x, y, color, count = 15, spread = 6) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const vel = Math.random() * spread + 1;
                particles.push({
                    x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel - 2,
                    life: 1, decay: 0.02 + Math.random() * 0.02, color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function addScorePop(x, y, text, color = '#fff') {
            scorePops.push({ x, y, text, color, life: 1, vy: -2 });
        }

        function spawnObstacle() {
            const types = ['spike', 'tall', 'double', 'low'];
            const type = types[Math.floor(Math.random() * types.length)];
            let w, h, gapY;

            if (type === 'spike') { w = 20 + Math.random() * 10; h = 40 + Math.random() * 30; }
            else if (type === 'tall') { w = 16; h = 80 + Math.random() * 40; }
            else if (type === 'double') { w = 20; h = 35; gapY = groundY - 90 - Math.random() * 30; }
            else { w = 50 + Math.random() * 30; h = 18; }

            obstacles.push({
                x: W + 50, y: groundY - h, w, h, type,
                hue: 0 + Math.random() * 40, passed: false, speed: speed
            });

            // Double obstacle: floating block
            if (type === 'double') {
                obstacles.push({
                    x: W + 50, y: gapY, w, h: 25, type: 'float',
                    hue: 220, passed: false, speed: speed
                });
            }
        }

        function jump() {
            if (!playing) return;
            if (player.grounded) {
                player.vy = -13;
                player.grounded = false;
                doubleJumpAvailable = true;
                jumps++;
                burst(player.x, player.y + player.r, '#3B82F6', 8, 4);
            } else if (doubleJumpAvailable) {
                player.vy = -11;
                doubleJumpAvailable = false;
                jumps++;
                burst(player.x, player.y, '#8B5CF6', 12, 5);
                addScorePop(player.x, player.y - 20, 'DOUBLE!', '#8B5CF6');
            }
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
        window.addEventListener('mousedown', jump);

        startBtn.onclick = (e) => {
            e.stopPropagation();
            playing = true;
            overlay.style.display = 'none';
            document.getElementById('final-stats').style.display = 'none';
            initGame();
            post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;

            // Speed ramp
            speed = 3.5 + score / 300;

            // Gravity
            player.vy += 0.55;
            player.y += player.vy;

            // Ground collision
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                if (!player.grounded) {
                    player.grounded = true;
                    // Landing particles
                    for (let i = 0; i < 4; i++) {
                        particles.push({
                            x: player.x + (Math.random() - 0.5) * 20, y: groundY + player.r,
                            vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2,
                            life: 0.6, decay: 0.03, color: 'rgba(255,255,255,0.4)', size: 2
                        });
                    }
                }
            }

            // Player trail
            player.trail.push({ x: player.x, y: player.y, alpha: 1 });
            if (player.trail.length > 12) player.trail.shift();
            player.trail.forEach(t => t.alpha -= 0.08);

            // Obstacle spawn
            const spawnRate = Math.max(50, 100 - Math.floor(speed * 3));
            if (frame % spawnRate === 0) spawnObstacle();

            // Move stars
            bgStars.forEach(s => { s.x -= s.v * (speed / 3.5); if (s.x < -5) { s.x = W + 5; s.y = Math.random() * H * 0.75; } });

            // Combo timer
            if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 0; }
            multiplierEl.style.opacity = combo >= 2 ? '1' : '0';
            multiplierEl.textContent = `x${combo} COMBO`;

            // Shake decay
            if (shakeDur > 0) {
                shakeDur--;
                shakeX *= 0.85;
                shakeY *= 0.85;
            } else { shakeX = shakeY = 0; }

            // Move & check obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= speed;

                // Collision (AABB with circle approximation)
                const px = player.x, py = player.y;
                const pr = player.r * 0.7; // forgiving hitbox
                if (px + pr > o.x && px - pr < o.x + o.w && py + pr > o.y && py - pr < o.y + o.h) {
                    gameOver();
                    return;
                }

                // Near miss detection
                if (!o.passed && px + pr > o.x - 5 && px - pr < o.x + o.w + 5 && py + pr > o.y - 15 && py - pr < o.y + o.h + 15) {
                    if (!(px + pr > o.x && px - pr < o.x + o.w && py + pr > o.y && py - pr < o.y + o.h)) {
                        // Near miss! Give bonus
                        if (!o.nearMissed) {
                            o.nearMissed = true;
                            nearMisses++;
                            score += 5;
                            addScorePop(o.x, o.y - 10, '+5 CLOSE!', '#F59E0B');
                        }
                    }
                }

                // Passed
                if (!o.passed && o.x + o.w < px) {
                    o.passed = true;
                    score += 10;
                    combo++;
                    comboTimer = 120;
                    if (combo >= 2) {
                        const bonusScore = combo * 5;
                        score += bonusScore;
                        addScorePop(px, py - 40, `+${10 + bonusScore}`, '#10B981');
                    } else {
                        addScorePop(px, py - 40, '+10', '#fff');
                    }
                    scoreEl.textContent = score.toString().padStart(3, '0');
                    if (score % 50 === 0) post('GAMEPLAY', 'SCORE_UPDATE', { score });
                }

                // Remove offscreen
                if (o.x + o.w < -50) obstacles.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.1;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Score pops
            for (let i = scorePops.length - 1; i >= 0; i--) {
                const sp = scorePops[i];
                sp.y += sp.vy;
                sp.life -= 0.02;
                if (sp.life <= 0) scorePops.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            ctx.translate(shakeX, shakeY);
            ctx.fillStyle = '#030712';
            ctx.fillRect(-10, -10, W + 20, H + 20);

            // Stars
            bgStars.forEach(s => {
                ctx.globalAlpha = s.alpha + Math.sin(frame * 0.02 + s.x) * 0.1;
                ctx.fillStyle = s.layer === 2 ? '#60A5FA' : '#fff';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Ground
            const gLineY = groundY + player.r + 2;
            const grad = ctx.createLinearGradient(0, gLineY, 0, gLineY + 40);
            grad.addColorStop(0, 'rgba(59, 130, 246, 0.15)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, gLineY, W, 40);
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, gLineY); ctx.lineTo(W, gLineY); ctx.stroke();

            // Ground dash marks (scrolling)
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.08)';
            const offset = (frame * speed) % 40;
            for (let x = -offset; x < W + 40; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, gLineY + 8); ctx.lineTo(x + 15, gLineY + 8); ctx.stroke();
            }

            // Player trail
            player.trail.forEach((t, i) => {
                if (t.alpha <= 0) return;
                ctx.globalAlpha = t.alpha * 0.3;
                ctx.fillStyle = '#3B82F6';
                ctx.beginPath(); ctx.arc(t.x, t.y, player.r * (0.5 + t.alpha * 0.5), 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Player
            ctx.fillStyle = '#3B82F6';
            ctx.shadowBlur = 25; ctx.shadowColor = '#3B82F6';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            // Inner glow
            ctx.fillStyle = 'rgba(96, 165, 250, 0.6)';
            ctx.beginPath(); ctx.arc(player.x - 3, player.y - 3, player.r * 0.5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Double jump indicator
            if (!player.grounded && doubleJumpAvailable) {
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.5)';
                ctx.lineWidth = 2;
                const pulseR = player.r + 6 + Math.sin(frame * 0.15) * 3;
                ctx.beginPath(); ctx.arc(player.x, player.y, pulseR, 0, Math.PI * 2); ctx.stroke();
            }

            // Obstacles
            obstacles.forEach(o => {
                const hue = o.type === 'float' ? 220 : 0;
                const color = o.type === 'float' ? '#8B5CF6' : '#EF4444';
                const glow = o.type === 'float' ? 'rgba(139,92,246,0.4)' : 'rgba(239,68,68,0.3)';

                ctx.fillStyle = color;
                ctx.shadowBlur = 15; ctx.shadowColor = glow;

                if (o.type === 'spike') {
                    // Triangle spike
                    ctx.beginPath();
                    ctx.moveTo(o.x + o.w / 2, o.y);
                    ctx.lineTo(o.x + o.w, o.y + o.h);
                    ctx.lineTo(o.x, o.y + o.h);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.roundRect(o.x, o.y, o.w, o.h, 4);
                    ctx.fill();
                }

                // Top edge glow line
                ctx.strokeStyle = `rgba(255,255,255,0.2)`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y); ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Score pops
            scorePops.forEach(sp => {
                ctx.globalAlpha = sp.life;
                ctx.fillStyle = sp.color;
                ctx.font = `bold ${14 + (1 - sp.life) * 4}px Inter, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(sp.text, sp.x, sp.y);
            });
            ctx.globalAlpha = 1;

            // Speed lines at high speed
            if (speed > 6) {
                ctx.globalAlpha = Math.min(0.3, (speed - 6) * 0.05);
                for (let i = 0; i < 5; i++) {
                    const ly = Math.random() * H;
                    ctx.strokeStyle = '#3B82F6';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(W, ly); ctx.lineTo(W - 30 - Math.random() * 60, ly); ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            shake(12, 20);
            burst(player.x, player.y, '#EF4444', 25, 8);
            burst(player.x, player.y, '#F59E0B', 15, 5);

            post('GAMEPLAY', 'GAME_COMPLETE', { score, jumps, nearMisses, status: 'loss' });

            setTimeout(() => {
                overlay.style.display = 'flex';
                document.getElementById('title').textContent = 'IMPACT';
                document.getElementById('subtitle').textContent = '';
                const stats = document.getElementById('final-stats');
                stats.style.display = 'block';
                document.getElementById('final-score').textContent = score;
                document.getElementById('stat-distance').textContent = `Distance: ${Math.floor(score / 10)}m`;
                document.getElementById('stat-jumps').textContent = `Jumps: ${jumps}`;
                document.getElementById('stat-close').textContent = `Near misses: ${nearMisses}`;
                startBtn.textContent = 'RELAUNCH';
            }, 600);
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        initGame();
        draw();
    </script>
</body>

</html>
