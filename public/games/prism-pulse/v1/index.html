<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prism Pulse</title>
  <script src="../../_shared/durra-bridge.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#070914; touch-action:none; }
    canvas { position:fixed; inset:0; width:100%; height:100%; display:block; transform:translateZ(0); }
    #hud { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; justify-content:space-between; padding:calc(env(safe-area-inset-top, 12px) + 12px) 16px 10px; color:#fff; pointer-events:none; }
    .chip { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:8px 12px; min-width:90px; text-align:center; backdrop-filter: blur(8px); }
    .val { font-weight:800; font-size:20px; line-height:1; text-shadow:0 0 16px #00e676; }
    .lbl { font-size:10px; letter-spacing:1.6px; opacity:.7; margin-top:3px; text-transform:uppercase; }
    #controls { position:fixed; bottom:calc(env(safe-area-inset-bottom, 10px) + 12px); left:0; right:0; z-index:20; display:flex; justify-content:space-between; padding:0 18px; }
    .btn { width:76px; height:76px; border-radius:50%; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:white; font-size:27px; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    .btn:active { background:linear-gradient(135deg,#00e676,#00b0ff); }
    .mid { font-size:24px; font-weight:900; color:#050713; text-shadow:none; background:linear-gradient(135deg,#00e676,#00b0ff); }
    #overlay,#gameover { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.12), rgba(0,0,0,.88)); z-index:30; color:#fff; }
    #gameover { display:none; }
    .title { font-size:44px; font-weight:900; letter-spacing:4px; text-shadow:0 0 24px #00e676, 0 0 44px #00b0ff; }
    .sub { margin-top:8px; opacity:.72; text-transform:uppercase; letter-spacing:4px; font-size:11px; }
    .desc { max-width:320px; text-align:center; margin-top:14px; opacity:.85; font-size:13px; line-height:1.45; padding:0 20px; }
    .cta { margin-top:30px; border:none; border-radius:999px; padding:14px 36px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#050713; background:linear-gradient(135deg,#00e676,#00b0ff); }
    .score { font-size:58px; font-weight:900; background:linear-gradient(135deg,#00e676,#00b0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="chip"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
    <div class="chip"><div class="val" id="speed">0</div><div class="lbl">Speed</div></div>
  </div>
  <div id="controls">
    <button class="btn" id="left">◀</button>
    <button class="btn mid" id="boost">⚡</button>
    <button class="btn" id="right">▶</button>
  </div>
  <div id="overlay">
    <div class="title">PRISM</div>
    <div class="sub">Rhythm Puzzle</div>
    <div class="desc">Color pulse puzzle where you sync beats to break prisms.</div>
    <button class="cta" id="play">Play</button>
  </div>
  <div id="gameover">
    <div class="sub">Mission Score</div>
    <div class="score" id="final">0</div>
    <button class="cta" id="retry">Retry</button>
  </div>
<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d', { alpha: false });
  const overlay = document.getElementById('overlay');
  const gameover = document.getElementById('gameover');
  const scoreEl = document.getElementById('score');
  const speedEl = document.getElementById('speed');
  const finalEl = document.getElementById('final');

  let w=0,h=0,dpr=Math.min(2, window.devicePixelRatio || 1);
  let running=false, lane=1, targetLane=1, boost=false, speed=6.5, distance=0, energy=100;
  let obstacles=[], sparks=[], t=0;
  const lanes=[0.2,0.5,0.8];

  function resize() {
    w=window.innerWidth; h=window.innerHeight;
    cvs.width=Math.floor(w*dpr); cvs.height=Math.floor(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize, { passive: true }); resize();

  function reset() { running=true; lane=1; targetLane=1; speed=6.5; distance=0; energy=100; obstacles=[]; sparks=[]; t=0; gameover.style.display='none'; overlay.style.display='none'; post('GAME_STARTED'); }
  function post(type, extra={}) { window.parent?.postMessage({ type, ...extra }, '*'); }

  function addObstacle() {
    obstacles.push({ lane: (Math.random()*3)|0, y:-80, size:34 + Math.random()*26, hue: 180 + Math.random()*180 });
  }

  function explode(x,y,color) {
    for (let i=0;i<14;i++) sparks.push({ x,y, vx:(Math.random()-.5)*4.8, vy:-Math.random()*5.4, life:1, color });
  }

  function update() {
    if (!running) return;
    t += 1;
    lane += (targetLane-lane)*0.18;
    speed += boost && energy>0 ? 0.06 : -0.03;
    speed = Math.max(6.2, Math.min(14.5, speed));
    energy += boost ? -0.9 : 0.45;
    energy = Math.max(0, Math.min(100, energy));
    if (energy===0) boost=false;

    distance += speed*0.55;
    scoreEl.textContent = (distance|0).toString();
    speedEl.textContent = (speed*12|0).toString();

    if (Math.random() < 0.013 + speed/400) addObstacle();

    const px = lanes[Math.round(lane)] * w;
    const py = h - 140;

    for (let i=obstacles.length-1;i>=0;i--) {
      const o=obstacles[i];
      o.y += speed*1.55;
      if (o.y > h+120) obstacles.splice(i,1);
      const ox = lanes[o.lane] * w;
      if (Math.abs(px-ox) < 34 && Math.abs(py-o.y) < 44) {
        explode(px, py, 'hsl(' + o.hue + ' 100% 60%)');
        end();
        return;
      }
    }

    for (let i=sparks.length-1;i>=0;i--) {
      const p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life-=0.025;
      if (p.life<=0) sparks.splice(i,1);
    }

    if ((distance|0) % 100 === 0) post('SCORE_UPDATE', { score: distance|0, final:false });
  }

  function drawTrack() {
    const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0a1022'); g.addColorStop(1,'#02040c');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    const rw=w*0.72, rx=(w-rw)/2;
    ctx.fillStyle='rgba(12,18,38,0.98)'; ctx.fillRect(rx,0,rw,h);
    ctx.strokeStyle='#00e67655'; ctx.lineWidth=2;
    const yShift=(t*speed*0.7)%56;
    for (let y=-56+yShift;y<h;y+=56) {
      ctx.beginPath(); ctx.moveTo(rx+rw/3,y); ctx.lineTo(rx+rw/3,y+24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx+rw*2/3,y); ctx.lineTo(rx+rw*2/3,y+24); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.035)';
    for (let i=0;i<16;i++) ctx.fillRect((Math.sin((t+i)*0.04)+1)*0.5*w, (i*137+t*3)%h, 2, 2);
  }

  function draw() {
    drawTrack();
    const rw=w*0.72, rx=(w-rw)/2;

    obstacles.forEach(o => {
      const x=rx+lanes[o.lane]*rw;
      const s=o.size;
      ctx.save();
      ctx.translate(x,o.y);
      ctx.rotate((o.y+t)*0.01);
      ctx.fillStyle='hsl(' + o.hue + ' 95% 58%)';
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=18;
      ctx.fillRect(-s/2,-s/2,s,s);
      ctx.restore();
    });

    const px=rx+lanes[Math.round(lane)]*rw, py=h-140;
    const glow=ctx.createRadialGradient(px,py+10,8,px,py+10,48);
    glow.addColorStop(0,'#00e676cc'); glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(px,py+10,48,0,Math.PI*2); ctx.fill();

    ctx.fillStyle='#00b0ff';
    ctx.beginPath(); ctx.moveTo(px,py-32); ctx.lineTo(px-24,py+26); ctx.lineTo(px,py+14); ctx.lineTo(px+24,py+26); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();

    sparks.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;

    const meterW=Math.min(240,w*0.62), mx=(w-meterW)/2, my=h-40;
    ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fillRect(mx,my,meterW,8);
    const mg=ctx.createLinearGradient(mx,0,mx+meterW,0); mg.addColorStop(0,'#00e676'); mg.addColorStop(1,'#00b0ff');
    ctx.fillStyle=mg; ctx.fillRect(mx,my,meterW*(energy/100),8);
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  function end() {
    running=false;
    finalEl.textContent=(distance|0).toString();
    gameover.style.display='flex';
    post('SCORE_UPDATE', { score: distance|0, final:true });
  }

  const left=() => targetLane=Math.max(0,targetLane-1);
  const right=() => targetLane=Math.min(2,targetLane+1);
  document.getElementById('left').addEventListener('touchstart', e => { e.preventDefault(); left(); }, { passive:false });
  document.getElementById('right').addEventListener('touchstart', e => { e.preventDefault(); right(); }, { passive:false });
  document.getElementById('boost').addEventListener('touchstart', e => { e.preventDefault(); boost=true; }, { passive:false });
  document.getElementById('boost').addEventListener('touchend', () => boost=false);
  document.getElementById('play').addEventListener('click', reset);
  document.getElementById('retry').addEventListener('click', reset);
  document.addEventListener('keydown', e => { if (e.key==='ArrowLeft') left(); if (e.key==='ArrowRight') right(); if (e.key===' ') boost=true; if (e.key==='Enter' && !running) reset(); });
  document.addEventListener('keyup', e => { if (e.key===' ') boost=false; });

  window.addEventListener('message', e => {
    try {
      const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (msg.action === 'LIFECYCLE_PAUSE') running = false;
      if (msg.action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none' && gameover.style.display === 'none') running = true;
      if (msg.action === 'GAME_RESTART') reset();
    } catch (_) {}
  });
  post('READY');
  loop();
})();
</script>
</body>
</html>
