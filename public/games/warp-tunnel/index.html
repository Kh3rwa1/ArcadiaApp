<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warp Tunnel | Arcadia</title>
    <style>
        :root {
            --void: #000;
            --accent: #8B5CF6;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 30px var(--accent);
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 44px;
            font-weight: 900;
            margin: 0 0 6px;
            letter-spacing: -2px;
        }

        #overlay p {
            color: #9CA3AF;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            padding: 18px 52px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
    </div>
    <div id="overlay">
        <h1>WARP TUNNEL</h1>
        <p>SWIPE TO NAVIGATE THE VOID</p>
        <button class="btn" id="start-btn">WARP</button>
    </div>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, frame = 0;
        let playerX = 0.5, speed = 2;
        let rings = [], stars = [];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        // Stars background
        for (let i = 0; i < 100; i++) stars.push({ x: Math.random() * 1, y: Math.random() * 1, z: Math.random() * 2 + 0.5 });

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            score = 0; frame = 0; rings = []; speed = 2; playerX = 0.5;
            post('GAMEPLAY', 'GAME_START');
        };

        let targetX = 0.5;
        const handleMove = (e) => { const t = e.touches ? e.touches[0] : e; targetX = t.clientX / W; };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchstart', handleMove);

        function spawnRing() {
            const gapCenter = Math.random() * 0.6 + 0.2;
            const gapSize = Math.max(0.18, 0.35 - score / 2000);
            rings.push({ z: 20, gapCenter, gapSize, hue: Math.random() * 360, passed: false });
        }

        function update() {
            if (!playing) return;
            frame++;
            speed = 2 + score / 200;
            playerX += (targetX - playerX) * 0.1;

            if (frame % Math.max(15, 40 - Math.floor(speed)) === 0) spawnRing();

            rings.forEach((r, i) => {
                r.z -= speed * 0.05;
                if (r.z < 0.5 && !r.passed) {
                    r.passed = true;
                    const left = r.gapCenter - r.gapSize / 2;
                    const right = r.gapCenter + r.gapSize / 2;
                    if (playerX < left || playerX > right) {
                        gameOver(); return;
                    }
                    score += 10;
                    scoreEl.innerText = score;
                    post('GAMEPLAY', 'SCORE_UPDATE', { score });
                }
                if (r.z < 0) rings.splice(i, 1);
            });

            stars.forEach(s => { s.y += s.z * 0.003; if (s.y > 1) s.y = 0; });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            // Stars
            stars.forEach(s => {
                const sx = (s.x - 0.5) * W * 2 / s.z + W / 2;
                const sy = s.y * H;
                ctx.fillStyle = `rgba(255,255,255,${0.3 / s.z})`;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            });

            // Rings
            rings.forEach(r => {
                if (r.z <= 0) return;
                const scale = 1 / r.z;
                const cx = W / 2, cy = H / 2;
                const radius = W * 0.5 * scale;
                if (radius > W * 3) return;

                const gapStart = r.gapCenter - r.gapSize / 2;
                const gapEnd = r.gapCenter + r.gapSize / 2;

                ctx.strokeStyle = `hsla(${r.hue}, 80%, 60%, ${Math.min(1, scale * 0.3)})`;
                ctx.lineWidth = Math.max(2, 6 * scale);

                // Left wall
                ctx.beginPath();
                ctx.moveTo(cx - radius, cy - radius);
                ctx.lineTo(cx + radius, cy - radius);
                ctx.lineTo(cx + radius, cy + radius);
                ctx.lineTo(cx - radius, cy + radius);
                ctx.closePath();
                ctx.stroke();

                // Gap indicator
                const gx = cx - radius + gapStart * radius * 2;
                const gw = r.gapSize * radius * 2;
                ctx.fillStyle = `hsla(${r.hue}, 80%, 60%, ${Math.min(0.15, scale * 0.05)})`;
                ctx.fillRect(gx, cy - radius, gw, radius * 2);
            });

            // Player crosshair
            const px = playerX * W;
            ctx.strokeStyle = '#8B5CF6'; ctx.lineWidth = 2; ctx.shadowBlur = 15; ctx.shadowColor = '#8B5CF6';
            ctx.beginPath(); ctx.arc(px, H / 2, 12, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px - 20, H / 2); ctx.lineTo(px + 20, H / 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, H / 2 - 20); ctx.lineTo(px, H / 2 + 20); ctx.stroke();
            ctx.shadowBlur = 0;

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post('GAMEPLAY', 'GAME_COMPLETE', { score, status: 'loss' });
            overlay.style.display = 'flex';
            overlay.querySelector('h1').innerText = 'WARP FAILED';
            overlay.querySelector('p').innerText = `DISTANCE: ${score}`;
            startBtn.innerText = 'REWARP';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
