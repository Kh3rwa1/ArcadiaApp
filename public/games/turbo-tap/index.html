<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Tap | Arcadia</title>
    <style>
        :root { --void: #030712; --accent: #10B981; --accent2: #22D3EE; }
        body { margin: 0; background: var(--void); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 55px; width: 100%; text-align: center; pointer-events: none; }
        #score { font-size: 52px; font-weight: 900; text-shadow: 0 0 25px var(--accent); }
        #sub-text { font-size: 13px; color: #6B7280; letter-spacing: 3px; margin-top: 2px; }
        #timer-bar { position: absolute; top: 0; left: 0; height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 100%; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(16,185,129,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="timer-bar"></div>
    <div id="ui">
        <div id="score">0</div>
        <div id="sub-text">TAP AS FAST AS YOU CAN</div>
    </div>
    <div id="overlay">
        <h1 id="title">TURBO TAP</h1>
        <p id="subtitle">TAP AS FAST AS POSSIBLE IN 15 SECONDS</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-tps">Taps/sec: 0</div>
            <div class="sm" id="stat-best">Best burst: 0</div>
            <div class="sm" id="stat-perfect">Perfect taps: 0</div>
        </div>
        <button class="btn" id="start-btn">TAP IT</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const subText = document.getElementById('sub-text');
        const timerBar = document.getElementById('timer-bar');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0, score = 0;
        let particles = [], rings = [], pops = [];
        let startTime, maxTime = 15, taps = 0;
        let lastTapTime = 0, bestBurst = 0, currentBurst = 0, perfectTaps = 0;
        let centerPulse = 0, bgGlow = 0;

        const MILESTONES = [
            { tps: 3, label: 'WARMING UP', color: '#6B7280' },
            { tps: 5, label: 'GETTING FAST', color: '#3B82F6' },
            { tps: 7, label: 'TURBO MODE', color: '#10B981' },
            { tps: 9, label: 'BLAZING!', color: '#F59E0B' },
            { tps: 12, label: 'SUPERHUMAN!', color: '#EF4444' },
            { tps: 15, label: 'IMPOSSIBLE!', color: '#EC4899' }
        ];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function burst(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2; const v = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, decay: 0.04, color, size: 2 + Math.random() * 3 });
            }
        }

        function getCurrentMilestone() {
            const elapsed = Math.max(0.1, (Date.now() - startTime) / 1000);
            const tps = taps / elapsed;
            let ms = MILESTONES[0];
            for (const m of MILESTONES) { if (tps >= m.tps) ms = m; }
            return { ...ms, tps };
        }

        function handleTap(e) {
            if (!playing) return;
            const t = e.touches ? e.touches[0] : e;
            const mx = t.clientX, my = t.clientY;

            taps++; score = taps;
            scoreEl.textContent = score;
            centerPulse = 1;
            bgGlow = Math.min(1, bgGlow + 0.1);

            const now = Date.now();
            const gap = now - lastTapTime;
            lastTapTime = now;

            if (gap < 120) { currentBurst++; perfectTaps++; }
            else { currentBurst = 1; }
            if (currentBurst > bestBurst) bestBurst = currentBurst;

            const ms = getCurrentMilestone();
            subText.textContent = `${ms.label} · ${ms.tps.toFixed(1)} TPS`;

            burst(mx, my, ms.color, 8);
            rings.push({ x: mx, y: my, r: 10, alpha: 0.5, color: ms.color });

            if (taps % 10 === 0) {
                pops.push({ x: W / 2, y: H / 2 + 80, text: `${taps}!`, life: 1, vy: -2, color: ms.color });
                post('GAMEPLAY', 'SCORE_UPDATE', { score, tps: ms.tps.toFixed(1) });
            }
        }
        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive: false });
        window.addEventListener('mousedown', handleTap);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; taps = 0; bestBurst = 0; currentBurst = 0; perfectTaps = 0;
            frame = 0; bgGlow = 0;
            particles = []; rings = []; pops = [];
            scoreEl.textContent = '0'; startTime = Date.now(); lastTapTime = Date.now();
            post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;

            const elapsed = (Date.now() - startTime) / 1000;
            const timeLeft = Math.max(0, maxTime - elapsed);
            timerBar.style.width = (timeLeft / maxTime * 100) + '%';
            if (timeLeft <= 3) timerBar.style.background = 'linear-gradient(90deg, #EF4444, #F97316)';

            if (timeLeft <= 0) { gameOver(); return; }
            if (centerPulse > 0) centerPulse = Math.max(0, centerPulse - 0.05);
            if (bgGlow > 0) bgGlow = Math.max(0, bgGlow - 0.005);

            for (let i = rings.length - 1; i >= 0; i--) { rings[i].r += 4; rings[i].alpha -= 0.03; if (rings[i].alpha <= 0) rings.splice(i, 1); }
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = pops.length - 1; i >= 0; i--) { pops[i].y += pops[i].vy; pops[i].life -= 0.025; if (pops[i].life <= 0) pops.splice(i, 1); }
        }

        function draw() {
            ctx.fillStyle = '#030712'; ctx.fillRect(0, 0, W, H);

            const ms = playing ? getCurrentMilestone() : { color: '#10B981' };

            // BG glow
            if (bgGlow > 0) {
                const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.5);
                g.addColorStop(0, ms.color + Math.floor(bgGlow * 25).toString(16).padStart(2, '0'));
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            }

            // Center target circle
            const r = 60 + centerPulse * 25;
            ctx.strokeStyle = ms.color + '44';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(W / 2, H / 2, r + 30, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(W / 2, H / 2, r + 60, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = ms.color + '22';
            ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = ms.color;
            ctx.shadowBlur = 20; ctx.shadowColor = ms.color;
            ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;

            // Rings
            rings.forEach(ring => { ctx.globalAlpha = ring.alpha; ctx.strokeStyle = ring.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke(); }); ctx.globalAlpha = 1;

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            // Pops
            pops.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.font = `bold ${18 + (1 - p.life) * 8}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fillText(p.text, p.x, p.y); ctx.shadowBlur = 0; }); ctx.globalAlpha = 1;

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            const elapsed = maxTime;
            const tps = (taps / elapsed).toFixed(1);
            post('GAMEPLAY', 'GAME_COMPLETE', { score: taps, tps, bestBurst, perfectTaps, status: 'complete' });
            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'TIME!';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box'); stats.style.display = 'block';
            document.getElementById('final-score').textContent = taps;
            document.getElementById('stat-tps').textContent = `Taps/sec: ${tps}`;
            document.getElementById('stat-best').textContent = `Best burst: ${bestBurst}`;
            document.getElementById('stat-perfect').textContent = `Perfect taps: ${perfectTaps}`;
            startBtn.textContent = 'RETRY';
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
