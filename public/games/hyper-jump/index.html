<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper Jump | Arcadia</title>
    <style>
        :root { --void: #000; --accent: #10B981; --accent2: #3B82F6; --text: #F9FAFB; }
        body { margin: 0; background: var(--void); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 60px; left: 24px; pointer-events: none; }
        #score { font-size: 36px; font-weight: 900; text-shadow: 0 0 20px var(--accent); }
        #height-label { font-size: 12px; color: #6B7280; letter-spacing: 3px; margin-top: 2px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(16,185,129,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0m</div>
        <div id="height-label">HEIGHT</div>
    </div>
    <div id="overlay">
        <h1 id="title">HYPER JUMP</h1>
        <p id="subtitle">TAP SIDES TO MOVE · REACH THE STARS</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-height">Height: 0m</div>
            <div class="sm" id="stat-bounces">Bounces: 0</div>
            <div class="sm" id="stat-springs">Springs hit: 0</div>
        </div>
        <button class="btn" id="start-btn">ASCEND</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, cameraY = 0;
        let player, platforms, particles, stars;
        let bounces = 0, springsHit = 0;
        let moveDir = 0;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: "1.0", type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post("LIFECYCLE", "READY", { engine: "canvas" });

        function burst(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = 1 + Math.random() * 3;
                particles.push({ x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel - 1, life: 1, decay: 0.03, color, size: 2 + Math.random() * 2 });
            }
        }

        // Stars parallax
        function createStars() {
            stars = [];
            for (let layer = 0; layer < 3; layer++) {
                for (let i = 0; i < 25; i++) {
                    stars.push({ x: Math.random() * W, y: Math.random() * 50000 - 25000, r: 0.5 + Math.random() * (layer + 1), layer, alpha: 0.15 + layer * 0.1 });
                }
            }
        }

        function spawnPlatform(y) {
            const types = ['normal', 'spring', 'crumble', 'moving'];
            const weights = [0.55, 0.15, 0.15, 0.15];
            let rand = Math.random(), type = 'normal';
            for (let i = 0; i < types.length; i++) { rand -= weights[i]; if (rand <= 0) { type = types[i]; break; } }
            
            // Prevent crumble/moving at the very start
            if (score < 50 && (type === 'crumble' || type === 'moving')) type = 'normal';

            platforms.push({
                x: Math.random() * (W - 80), y, w: type === 'spring' ? 60 : 80, h: 10,
                type, crumbled: false, moveDir: Math.random() < 0.5 ? 1 : -1, moveSpeed: 1 + Math.random() * 1.5
            });
        }

        function initGame() {
            player = { x: W / 2 - 15, y: H - 100, w: 28, h: 28, vx: 0, vy: -14, squash: 0 };
            platforms = []; particles = []; bounces = 0; springsHit = 0;
            score = 0; cameraY = 0; moveDir = 0;
            createStars();
            for (let i = 0; i < 12; i++) spawnPlatform(H - i * (H / 10));
        }

        window.addEventListener('touchstart', (e) => {
            if (!playing) return;
            moveDir = e.touches[0].clientX < W / 2 ? -1 : 1;
        });
        window.addEventListener('touchend', () => moveDir = 0);
        window.addEventListener('mousedown', (e) => { if (playing) moveDir = e.clientX < W / 2 ? -1 : 1; });
        window.addEventListener('mouseup', () => moveDir = 0);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            initGame();
            post("GAMEPLAY", "GAME_START");
        };

        function update() {
            if (!playing) return;

            player.vx = moveDir * 7;
            player.vy += 0.48;
            player.y += player.vy;
            player.x += player.vx;

            // Wrap
            if (player.x < -player.w) player.x = W;
            if (player.x > W) player.x = -player.w;

            // Squash animation
            if (player.squash > 0) player.squash = Math.max(0, player.squash - 0.06);

            // Camera
            if (player.y < cameraY + H * 0.4) {
                cameraY = player.y - H * 0.4;
                score = Math.max(score, Math.floor(-cameraY / 12));
                scoreEl.textContent = score + 'm';
                if (score % 20 === 0 && score > 0) post("GAMEPLAY", "SCORE_UPDATE", { score });
            }

            // Moving platforms
            platforms.forEach(p => {
                if (p.type === 'moving') {
                    p.x += p.moveDir * p.moveSpeed;
                    if (p.x < 0 || p.x + p.w > W) p.moveDir *= -1;
                }
            });

            // Platform collision
            platforms.forEach(p => {
                if (p.crumbled) return;
                if (player.vy > 0 &&
                    player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h > p.y && player.y + player.h < p.y + 20) {

                    if (p.type === 'crumble') {
                        p.crumbled = true;
                        burst(p.x + p.w / 2, p.y, '#EF4444', 10);
                        player.vy = -14;
                    } else if (p.type === 'spring') {
                        player.vy = -22;
                        springsHit++;
                        burst(p.x + p.w / 2, p.y, '#10B981', 12);
                    } else {
                        player.vy = -14;
                    }

                    player.squash = 1;
                    bounces++;
                    burst(player.x + player.w / 2, p.y, 'rgba(255,255,255,0.5)', 5);
                }
            });

            // Spawn new platforms above
            const highestY = Math.min(...platforms.map(p => p.y));
            if (highestY > cameraY - 100) {
                const gap = Math.max(80, 150 - score / 5);
                spawnPlatform(highestY - gap);
            }

            // Remove platforms below screen
            platforms = platforms.filter(p => p.y < cameraY + H + 50);

            // Game over
            if (player.y > cameraY + H + 50) { gameOver(); return; }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            // Stars parallax
            stars.forEach(s => {
                const parallax = [0.02, 0.05, 0.1][s.layer];
                const sy = (s.y - cameraY * parallax) % (H * 2);
                ctx.globalAlpha = s.alpha + Math.sin(sy * 0.01) * 0.05;
                ctx.fillStyle = s.layer === 2 ? '#60A5FA' : '#fff';
                ctx.beginPath(); ctx.arc(s.x, sy, s.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.save();
            ctx.translate(0, -cameraY);

            // Height markers
            for (let h = 0; h > cameraY - H; h -= 200) {
                const hScore = Math.abs(Math.floor(h / 12));
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.font = '10px Inter, sans-serif';
                ctx.fillText(`${hScore}m`, W - 40, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(W, h); ctx.stroke();
            }

            // Platforms
            platforms.forEach(p => {
                if (p.crumbled) return;
                const colors = { normal: '#334155', spring: '#10B981', crumble: '#EF4444', moving: '#3B82F6' };
                const glows = { normal: 'transparent', spring: 'rgba(16,185,129,0.3)', crumble: 'rgba(239,68,68,0.2)', moving: 'rgba(59,130,246,0.3)' };

                ctx.fillStyle = colors[p.type];
                ctx.shadowBlur = p.type === 'normal' ? 0 : 12;
                ctx.shadowColor = glows[p.type];
                ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 5); ctx.fill();

                if (p.type === 'spring') {
                    ctx.fillStyle = '#34D399';
                    ctx.beginPath(); ctx.moveTo(p.x + p.w / 2, p.y - 6); ctx.lineTo(p.x + p.w / 2 - 6, p.y); ctx.lineTo(p.x + p.w / 2 + 6, p.y); ctx.fill();
                }
                ctx.shadowBlur = 0;
            });

            // Player
            const sy = 1 + player.squash * 0.3;
            const sx = 1 - player.squash * 0.15;
            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            ctx.scale(sx, 1 / sy);

            ctx.fillStyle = '#10B981';
            ctx.shadowBlur = 20; ctx.shadowColor = '#10B981';
            ctx.beginPath(); ctx.arc(0, 0, player.w / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.5)';
            ctx.beginPath(); ctx.arc(-3, -3, player.w / 4, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Direction indicator
            if (moveDir !== 0) {
                ctx.fillStyle = 'rgba(16,185,129,0.3)';
                ctx.beginPath();
                ctx.moveTo(moveDir * -player.w * 0.6, 0);
                ctx.lineTo(moveDir * -player.w * 0.2, -5);
                ctx.lineTo(moveDir * -player.w * 0.2, 5);
                ctx.fill();
            }

            ctx.restore();

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.restore();

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post("GAMEPLAY", "GAME_COMPLETE", { score, bounces, springsHit, status: "loss" });

            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'LIMIT REACHED';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box');
            stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-height').textContent = `Height: ${score}m`;
            document.getElementById('stat-bounces').textContent = `Bounces: ${bounces}`;
            document.getElementById('stat-springs').textContent = `Springs hit: ${springsHit}`;
            startBtn.textContent = 'RETRY';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
