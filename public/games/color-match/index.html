<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Match | Arcadia</title>
    <style>
        :root { --bg: #000000; --text: #ffffff; }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        canvas { position: fixed; inset: 0; z-index: 0; }

        #game-ui {
            position: relative; z-index: 5; display: flex; flex-direction: column;
            align-items: center; justify-content: center; width: 100%; height: 100%;
            pointer-events: none;
        }

        #word {
            font-size: 72px; font-weight: 900; letter-spacing: -3px;
            margin-bottom: 16px; text-transform: uppercase;
            text-shadow: 0 0 40px currentColor;
            transition: transform 0.1s;
        }

        #streak-display {
            font-size: 18px; font-weight: 800; letter-spacing: 4px;
            opacity: 0; transition: opacity 0.3s; margin-bottom: 20px;
        }

        .btn-container {
            display: flex; gap: 20px; width: 100%; padding: 0 20px;
            box-sizing: border-box; max-width: 400px; pointer-events: auto;
        }

        .btn {
            flex: 1; height: 80px; border-radius: 20px; border: none;
            font-size: 22px; font-weight: 800; cursor: pointer;
            transition: transform 0.1s; letter-spacing: 2px;
        }

        .btn:active { transform: scale(0.93); }
        .btn-no { background: #EF4444; color: white; box-shadow: 0 4px 0 #B91C1C, 0 0 25px rgba(239,68,68,0.3); }
        .btn-yes { background: #10B981; color: white; box-shadow: 0 4px 0 #059669, 0 0 25px rgba(16,185,129,0.3); }

        #score { position: absolute; top: 50px; font-size: 36px; font-weight: 900; opacity: 0.5; text-shadow: 0 0 15px currentColor; }
        #timer-bar { position: absolute; top: 0; left: 0; height: 6px; background: linear-gradient(90deg, #3B82F6, #8B5CF6); width: 100%; box-shadow: 0 0 10px rgba(59,130,246,0.5); transition: background 0.3s; }

        #overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(8px);
        }

        #overlay h1 {
            font-size: 48px; font-weight: 900; margin: 0 0 6px; letter-spacing: -2px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }

        .start-btn {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6); color: white;
            padding: 20px 60px; font-size: 18px; font-weight: 800;
            border: none; border-radius: 16px; cursor: pointer; letter-spacing: 3px;
            box-shadow: 0 0 35px rgba(59,130,246,0.4); pointer-events: auto;
        }

        .start-btn:active { transform: scale(0.96); }

        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 60px; font-weight: 900; background: linear-gradient(135deg, #3B82F6, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }

        #feedback-flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 4;
            opacity: 0; transition: opacity 0.15s;
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div id="feedback-flash"></div>
    <div id="timer-bar"></div>
    <div id="game-ui">
        <div id="score">0</div>
        <div id="word">READY</div>
        <div id="streak-display">🔥 5x STREAK</div>
        <div class="btn-container">
            <button class="btn btn-no" onclick="handleChoice(false)">NO</button>
            <button class="btn btn-yes" onclick="handleChoice(true)">YES</button>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title">COLOR MATCH</h1>
        <p id="subtitle">Does the meaning match the color?</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-correct">Correct: 0</div>
            <div class="sm" id="stat-wrong">Wrong: 0</div>
            <div class="sm" id="stat-streak">Best streak: 0</div>
        </div>
        <button class="start-btn" onclick="startGame()">PLAY</button>
    </div>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const COLORS = [
            { name: 'RED', hex: '#EF4444' }, { name: 'BLUE', hex: '#3B82F6' },
            { name: 'GREEN', hex: '#10B981' }, { name: 'YELLOW', hex: '#F59E0B' },
            { name: 'PURPLE', hex: '#8B5CF6' }, { name: 'CYAN', hex: '#06B6D4' },
            { name: 'PINK', hex: '#EC4899' }
        ];

        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgW, bgH;
        let bgParticles = [];

        function resizeBg() {
            bgW = bgCanvas.width = window.innerWidth;
            bgH = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg); resizeBg();

        // Ambient background particles
        for (let i = 0; i < 30; i++) {
            bgParticles.push({
                x: Math.random() * bgW, y: Math.random() * bgH,
                vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                r: 1 + Math.random() * 2, alpha: 0.1 + Math.random() * 0.15,
                hue: Math.random() * 360
            });
        }

        let score = 0, isPlaying = false, timeLeft = 0, currentMatch = false;
        let gameLoop, streak = 0, bestStreak = 0, correct = 0, wrong = 0;
        let shakeAmount = 0, wordScale = 1;

        const wordEl = document.getElementById('word');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer-bar');
        const overlay = document.getElementById('overlay');
        const streakEl = document.getElementById('streak-display');
        const flashEl = document.getElementById('feedback-flash');

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: "1.0", type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post("LIFECYCLE", "READY");

        function flash(color) {
            flashEl.style.background = color;
            flashEl.style.opacity = '0.3';
            setTimeout(() => flashEl.style.opacity = '0', 200);
        }

        function startGame() {
            score = 0; streak = 0; bestStreak = 0; correct = 0; wrong = 0;
            scoreEl.innerText = '0'; scoreEl.style.opacity = '0.5';
            overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            isPlaying = true;
            nextRound();
            post("GAMEPLAY", "GAME_START");
        }

        function nextRound() {
            if (!isPlaying) return;
            currentMatch = Math.random() > 0.5;
            const wordIdx = Math.floor(Math.random() * COLORS.length);
            let colorIdx = wordIdx;
            if (!currentMatch) {
                do { colorIdx = Math.floor(Math.random() * COLORS.length); } while (colorIdx === wordIdx);
            }

            wordEl.innerText = COLORS[wordIdx].name;
            wordEl.style.color = COLORS[colorIdx].hex;
            wordScale = 1.15;

            streakEl.style.opacity = streak >= 3 ? '1' : '0';
            streakEl.textContent = `🔥 ${streak}x STREAK`;
            streakEl.style.color = streak >= 5 ? '#F59E0B' : streak >= 3 ? '#F97316' : '#fff';

            const duration = Math.max(800, 2200 - (score * 40));
            startTimer(duration);
        }

        function startTimer(ms) {
            cancelAnimationFrame(gameLoop);
            const start = performance.now();
            function update(time) {
                if (!isPlaying) return;
                const elapsed = time - start;
                const remaining = Math.max(0, 1 - (elapsed / ms));
                timerEl.style.width = (remaining * 100) + '%';

                if (remaining < 0.3) {
                    timerEl.style.background = 'linear-gradient(90deg, #EF4444, #F97316)';
                    timerEl.style.boxShadow = '0 0 15px rgba(239,68,68,0.6)';
                } else {
                    timerEl.style.background = 'linear-gradient(90deg, #3B82F6, #8B5CF6)';
                    timerEl.style.boxShadow = '0 0 10px rgba(59,130,246,0.5)';
                }

                if (remaining <= 0) { handleWrong(); }
                else gameLoop = requestAnimationFrame(update);
            }
            gameLoop = requestAnimationFrame(update);
        }

        function handleChoice(choice) {
            if (!isPlaying) return;
            if (choice === currentMatch) {
                correct++;
                streak++;
                if (streak > bestStreak) bestStreak = streak;
                const multiplier = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
                score += 10 * multiplier;
                scoreEl.innerText = score;
                flash('rgba(16,185,129,0.4)');
                post("GAMEPLAY", "SCORE_UPDATE", { score, streak });
                nextRound();
            } else {
                handleWrong();
            }
        }

        function handleWrong() {
            wrong++;
            if (wrong >= 3) { gameOver(); return; }
            streak = 0;
            shakeAmount = 8;
            flash('rgba(239,68,68,0.4)');
            wordEl.style.transform = `translateX(${shakeAmount}px)`;
            setTimeout(() => { wordEl.style.transform = `translateX(-${shakeAmount}px)`; }, 50);
            setTimeout(() => { wordEl.style.transform = ''; nextRound(); }, 150);
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(gameLoop);
            post("GAMEPLAY", "GAME_COMPLETE", { score, correct, wrong, bestStreak, status: "loss" });

            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'GAME OVER';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box');
            stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-correct').textContent = `Correct: ${correct}`;
            document.getElementById('stat-wrong').textContent = `Wrong: ${wrong}`;
            document.getElementById('stat-streak').textContent = `Best streak: ${bestStreak}x`;
            document.querySelector('.start-btn').textContent = 'TRY AGAIN';
        }

        // Background animation
        function drawBg() {
            bgCtx.fillStyle = 'rgba(0,0,0,0.15)';
            bgCtx.fillRect(0, 0, bgW, bgH);

            bgParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = bgW; if (p.x > bgW) p.x = 0;
                if (p.y < 0) p.y = bgH; if (p.y > bgH) p.y = 0;

                bgCtx.globalAlpha = p.alpha;
                bgCtx.fillStyle = `hsla(${p.hue}, 50%, 50%, 1)`;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); bgCtx.fill();
            });
            bgCtx.globalAlpha = 1;

            // Word scale animation
            if (wordScale > 1) {
                wordScale = Math.max(1, wordScale - 0.008);
                wordEl.style.transform = `scale(${wordScale})`;
            }

            requestAnimationFrame(drawBg);
        }
        drawBg();
    </script>
</body>

</html>
