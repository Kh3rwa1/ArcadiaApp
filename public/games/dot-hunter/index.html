<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dot Hunter | Arcadia</title>
    <style>
        :root {
            --void: #030712;
            --accent: #F43F5E;
            --accent2: #F97316;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 25px var(--accent);
        }

        #combo-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent2);
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 2px;
        }

        #timer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            box-shadow: 0 0 12px var(--accent);
            transition: width 0.1s linear;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        #overlay h1 {
            font-size: 46px;
            font-weight: 900;
            margin: 0 0 6px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; font-size: 14px; }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            padding: 18px 56px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 35px rgba(244, 63, 94, 0.4);
        }

        .btn:active { transform: scale(0.96); }

        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 60px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="timer-bar" style="width:100%"></div>
    <div id="ui">
        <div id="score">0</div>
        <div id="combo-text">5x COMBO</div>
    </div>
    <div id="overlay">
        <h1 id="title">DOT HUNTER</h1>
        <p id="subtitle">TAP TARGETS · SCORE BIG · 30 SECONDS</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-hits">Hits: 0</div>
            <div class="sm" id="stat-misses">Misses: 0</div>
            <div class="sm" id="stat-accuracy">Accuracy: 0%</div>
            <div class="sm" id="stat-combo">Best combo: 0</div>
        </div>
        <button class="btn" id="start-btn">HUNT</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const comboText = document.getElementById('combo-text');
        const timerBar = document.getElementById('timer-bar');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, frame = 0;
        let targets = [], particles = [], scorePops = [], ripples = [];
        let combo = 0, bestCombo = 0, hits = 0, misses = 0;
        let timeStart = 0, maxTime = 30;
        let shakeX = 0, shakeY = 0, shakeDur = 0;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function shake(intensity, dur) { shakeDur = dur; shakeX = (Math.random() - 0.5) * intensity; shakeY = (Math.random() - 0.5) * intensity; }

        function burst(x, y, color, count = 18) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
                const vel = 2 + Math.random() * 5;
                particles.push({ x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel, life: 1, decay: 0.025, color, size: 2 + Math.random() * 3 });
            }
        }

        function addRipple(x, y, color) {
            ripples.push({ x, y, r: 10, maxR: 60, alpha: 0.6, color });
        }

        function addScorePop(x, y, text, color) {
            scorePops.push({ x, y, text, color, life: 1, vy: -2.5 });
        }

        function spawnTarget() {
            const margin = 70;
            const minR = Math.max(14, 30 - score / 80);
            const maxR = Math.max(20, 45 - score / 60);
            const r = minR + Math.random() * (maxR - minR);
            const x = margin + Math.random() * (W - margin * 2);
            const y = margin + 110 + Math.random() * (H - margin * 2 - 180);
            const hue = Math.random() * 360;
            const isGold = Math.random() < 0.12; // 12% gold bonus target
            const lifeSpan = isGold ? 1.5 : Math.max(2, 4 - score / 200);

            targets.push({
                x, y, r, hue,
                isGold,
                born: Date.now(),
                lifeSpan, // seconds
                pulse: 0,
                spawnAnim: 0
            });
        }

        function handleTap(e) {
            if (!playing) return;
            const t = e.touches ? e.touches[0] : e;
            const mx = t.clientX, my = t.clientY;
            let hit = false;

            for (let i = targets.length - 1; i >= 0; i--) {
                const tgt = targets[i];
                const dist = Math.hypot(mx - tgt.x, my - tgt.y);
                if (dist < tgt.r + 12) {
                    hit = true;
                    hits++;
                    combo++;
                    if (combo > bestCombo) bestCombo = combo;

                    // Score calculation
                    const elapsed = (Date.now() - tgt.born) / 1000;
                    const speedBonus = Math.max(0, Math.floor((1 - elapsed / tgt.lifeSpan) * 30));
                    let points = 10 + speedBonus;
                    if (tgt.isGold) points *= 3;
                    if (combo >= 3) points += combo * 5;
                    score += points;

                    // Effects
                    const color = tgt.isGold ? '#FBBF24' : `hsl(${tgt.hue}, 80%, 60%)`;
                    burst(tgt.x, tgt.y, color, tgt.isGold ? 25 : 18);
                    addRipple(tgt.x, tgt.y, color);
                    addScorePop(tgt.x, tgt.y - tgt.r - 10, `+${points}`, color);

                    if (combo >= 3) {
                        comboText.textContent = `${combo}x COMBO!`;
                        comboText.style.opacity = '1';
                    }

                    targets.splice(i, 1);
                    spawnTarget();
                    if (Math.random() < 0.25 && targets.length < 5) spawnTarget();

                    scoreEl.textContent = score;
                    post('GAMEPLAY', 'SCORE_UPDATE', { score, combo });
                    break;
                }
            }

            if (!hit) {
                misses++;
                combo = 0;
                comboText.style.opacity = '0';
                shake(4, 6);
                addRipple(mx, my, '#EF4444');
                // Time penalty
                timeStart -= 1000;
            }
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive: false });
        window.addEventListener('mousedown', handleTap);

        startBtn.onclick = (e) => {
            e.stopPropagation();
            playing = true;
            overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; hits = 0; misses = 0; combo = 0; bestCombo = 0;
            targets = []; particles = []; scorePops = []; ripples = [];
            scoreEl.textContent = '0';
            timeStart = Date.now();
            spawnTarget(); spawnTarget(); spawnTarget();
            post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;

            const elapsed = (Date.now() - timeStart) / 1000;
            const timeLeft = Math.max(0, maxTime - elapsed);
            timerBar.style.width = (timeLeft / maxTime * 100) + '%';

            if (timeLeft <= 5) timerBar.style.background = 'linear-gradient(90deg, #EF4444, #F97316)';
            else timerBar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';

            if (timeLeft <= 0) { gameOver(); return; }

            // Expire targets
            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const age = (Date.now() - t.born) / 1000;
                if (t.spawnAnim < 1) t.spawnAnim = Math.min(1, t.spawnAnim + 0.08);
                t.pulse = Math.sin(age * 5) * 0.12;

                if (age > t.lifeSpan) {
                    targets.splice(i, 1);
                    combo = 0;
                    comboText.style.opacity = '0';
                    spawnTarget();
                }
            }

            // Ensure minimum targets
            while (targets.length < 2) spawnTarget();
            // Add more at higher scores
            const maxTargets = Math.min(5, 3 + Math.floor(score / 200));
            if (targets.length < maxTargets && Math.random() < 0.005) spawnTarget();

            // Decay shake
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.98; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.r += 3; r.alpha -= 0.02;
                if (r.alpha <= 0) ripples.splice(i, 1);
            }

            // Update score pops
            for (let i = scorePops.length - 1; i >= 0; i--) {
                const sp = scorePops[i];
                sp.y += sp.vy; sp.life -= 0.02;
                if (sp.life <= 0) scorePops.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            ctx.translate(shakeX, shakeY);
            ctx.fillStyle = '#030712';
            ctx.fillRect(-5, -5, W + 10, H + 10);

            // Background ambient glow
            const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.5);
            bgGrad.addColorStop(0, 'rgba(244, 63, 94, 0.04)');
            bgGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Ripples
            ripples.forEach(r => {
                ctx.globalAlpha = r.alpha;
                ctx.strokeStyle = r.color;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
            });
            ctx.globalAlpha = 1;

            // Targets
            targets.forEach(t => {
                const age = (Date.now() - t.born) / 1000;
                const lifeRatio = 1 - age / t.lifeSpan;
                const r = t.r * (t.spawnAnim) * (1 + t.pulse);
                const color = t.isGold ? '#FBBF24' : `hsl(${t.hue}, 80%, 60%)`;
                const colorFaded = t.isGold ? 'rgba(251,191,36,0.3)' : `hsla(${t.hue}, 80%, 60%, 0.3)`;

                // Outer shrinking ring
                if (lifeRatio > 0) {
                    ctx.strokeStyle = colorFaded;
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(t.x, t.y, r + lifeRatio * 25, 0, Math.PI * 2); ctx.stroke();
                }

                // Danger ring when about to expire
                if (lifeRatio < 0.3) {
                    ctx.strokeStyle = '#EF4444';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(t.x, t.y, r + 5, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Main target
                ctx.fillStyle = color;
                ctx.shadowBlur = 25; ctx.shadowColor = color;
                ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;

                // Inner highlight
                ctx.fillStyle = `rgba(255,255,255,0.35)`;
                ctx.beginPath(); ctx.arc(t.x - r * 0.2, t.y - r * 0.2, r * 0.35, 0, Math.PI * 2); ctx.fill();

                // Gold indicator
                if (t.isGold) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${r * 0.7}px Inter, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', t.x, t.y + 1);
                }
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // Score pops
            scorePops.forEach(sp => {
                ctx.globalAlpha = sp.life;
                ctx.fillStyle = sp.color;
                ctx.font = `bold ${16 + (1 - sp.life) * 6}px Inter, sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10; ctx.shadowColor = sp.color;
                ctx.fillText(sp.text, sp.x, sp.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            const accuracy = hits + misses > 0 ? Math.round(hits / (hits + misses) * 100) : 0;
            post('GAMEPLAY', 'GAME_COMPLETE', { score, hits, misses, accuracy, bestCombo, status: 'complete' });

            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'TIME UP!';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box');
            stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-hits').textContent = `Hits: ${hits}`;
            document.getElementById('stat-misses').textContent = `Misses: ${misses}`;
            document.getElementById('stat-accuracy').textContent = `Accuracy: ${accuracy}%`;
            document.getElementById('stat-combo').textContent = `Best combo: ${bestCombo}x`;
            startBtn.textContent = 'RETRY';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
