<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plasma Pong | Arcadia</title>
    <style>
        :root {
            --void: #000;
            --accent: #06B6D4;
            --text: #F9FAFB;
        }

        body {
            margin: 0;
            background: var(--void);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 0 0 20px var(--accent);
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 44px;
            font-weight: 900;
            margin: 0 0 6px;
            letter-spacing: -1px;
        }

        #overlay p {
            color: #9CA3AF;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 18px 52px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0 — 0</div>
    </div>
    <div id="overlay">
        <h1>PLASMA PONG</h1>
        <p>DRAG YOUR PADDLE · BEAT THE AI</p>
        <button class="btn" id="start-btn">SERVE</button>
    </div>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0;
        let playerScore = 0, aiScore = 0;
        let paddle = { y: 0, h: 100, w: 12 };
        let aiPaddle = { y: 0, h: 100, w: 12 };
        let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
        let particles = [], trail = [];

        function resize() {
            W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
            paddle.y = H / 2 - paddle.h / 2;
            aiPaddle.y = H / 2 - aiPaddle.h / 2;
        }
        window.addEventListener('resize', resize); resize();

        function post(type, action, payload = {}) {
            const msg = JSON.stringify({ version: '1.0', type, action, payload });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function resetBall(dir) {
            ball.x = W / 2; ball.y = H / 2;
            ball.vx = (4 + playerScore * 0.3 + aiScore * 0.3) * dir;
            ball.vy = (Math.random() - 0.5) * 6;
        }

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            playerScore = 0; aiScore = 0; particles = []; trail = [];
            resetBall(1);
            post('GAMEPLAY', 'GAME_START');
        };

        let targetY = H / 2;
        const handleMove = (e) => { const t = e.touches ? e.touches[0] : e; targetY = t.clientY; };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchstart', handleMove);

        function burst(x, y, color) {
            for (let i = 0; i < 12; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color });
        }

        function update() {
            if (!playing) return;
            frame++;

            // Player paddle follows finger
            paddle.y += (targetY - paddle.y - paddle.h / 2) * 0.15;
            paddle.y = Math.max(0, Math.min(H - paddle.h, paddle.y));

            // AI paddle tracks ball
            const aiTarget = ball.y - aiPaddle.h / 2;
            const aiSpeed = 3 + (playerScore + aiScore) * 0.2;
            aiPaddle.y += Math.sign(aiTarget - aiPaddle.y) * Math.min(aiSpeed, Math.abs(aiTarget - aiPaddle.y));
            aiPaddle.y = Math.max(0, Math.min(H - aiPaddle.h, aiPaddle.y));

            // Ball movement
            trail.push({ x: ball.x, y: ball.y, alpha: 1 });
            if (trail.length > 20) trail.shift();
            trail.forEach(t => t.alpha -= 0.05);

            ball.x += ball.vx; ball.y += ball.vy;

            // Top/bottom bounce
            if (ball.y - ball.r < 0 || ball.y + ball.r > H) { ball.vy *= -1; ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y)); }

            // Player paddle hit
            if (ball.x - ball.r < 30 + paddle.w && ball.y > paddle.y && ball.y < paddle.y + paddle.h && ball.vx < 0) {
                ball.vx = Math.abs(ball.vx) * 1.05;
                ball.vy += (ball.y - (paddle.y + paddle.h / 2)) * 0.15;
                burst(ball.x, ball.y, '#06B6D4');
            }

            // AI paddle hit
            if (ball.x + ball.r > W - 30 - aiPaddle.w && ball.y > aiPaddle.y && ball.y < aiPaddle.y + aiPaddle.h && ball.vx > 0) {
                ball.vx = -Math.abs(ball.vx) * 1.05;
                ball.vy += (ball.y - (aiPaddle.y + aiPaddle.h / 2)) * 0.15;
                burst(ball.x, ball.y, '#EF4444');
            }

            // Score
            if (ball.x < 0) { aiScore++; updateScore(); resetBall(1); }
            if (ball.x > W) { playerScore++; updateScore(); resetBall(-1); }

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; if (p.life <= 0) particles.splice(i, 1); });

            if (playerScore >= 7 || aiScore >= 7) gameOver();
        }

        function updateScore() {
            scoreEl.innerText = `${playerScore} — ${aiScore}`;
            post('GAMEPLAY', 'SCORE_UPDATE', { player: playerScore, ai: aiScore });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            // Center line
            ctx.setLineDash([8, 12]); ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
            ctx.setLineDash([]);

            // Trail
            trail.forEach(t => {
                if (t.alpha <= 0) return;
                ctx.globalAlpha = t.alpha * 0.5; ctx.fillStyle = '#06B6D4';
                ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * 0.7, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Player paddle
            ctx.fillStyle = '#06B6D4'; ctx.shadowBlur = 15; ctx.shadowColor = '#06B6D4';
            ctx.beginPath(); ctx.roundRect(20, paddle.y, paddle.w, paddle.h, 6); ctx.fill();
            ctx.shadowBlur = 0;

            // AI paddle
            ctx.fillStyle = '#EF4444'; ctx.shadowBlur = 15; ctx.shadowColor = '#EF4444';
            ctx.beginPath(); ctx.roundRect(W - 20 - aiPaddle.w, aiPaddle.y, aiPaddle.w, aiPaddle.h, 6); ctx.fill();
            ctx.shadowBlur = 0;

            // Ball
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = '#06B6D4';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1;

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            const won = playerScore > aiScore;
            post('GAMEPLAY', 'GAME_COMPLETE', { player: playerScore, ai: aiScore, status: won ? 'win' : 'loss' });
            overlay.style.display = 'flex';
            overlay.querySelector('h1').innerText = won ? 'VICTORY' : 'DEFEATED';
            overlay.querySelector('p').innerText = `${playerScore} — ${aiScore}`;
            startBtn.innerText = 'REMATCH';
        }

        window.addEventListener('ArcadiaBridge', (e) => {
            const { action } = e.detail || {};
            if (action === 'LIFECYCLE_PAUSE') playing = false;
            if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true;
        });

        draw();
    </script>
</body>

</html>
