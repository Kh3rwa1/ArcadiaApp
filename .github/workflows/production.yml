name: Arcadia Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  expo-test:
    name: Expo Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: TypeScript Check
      run: npx tsc --noEmit

    - name: Run Tests
      run: npx jest --coverage --passWithNoTests

    - name: Expo Build (Web)
      run: npx expo export -p web
      env:
        CI: false

  laravel-test:
    name: Laravel Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arcadia_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_mysql, zip
        tools: composer:v2

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Create .env
      run: cp .env.example .env

    - name: Generate Key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: arcadia_test
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Security Audit
      run: composer audit || echo "::warning::Composer audit found vulnerabilities (non-blocking)"
