<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbit Lock | Arcadia</title>
    <style>
        :root { --void: #000; --accent: #F59E0B; --accent2: #EF4444; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 55px; width: 100%; text-align: center; pointer-events: none; }
        #score { font-size: 42px; font-weight: 900; text-shadow: 0 0 20px var(--accent); }
        #level-text { font-size: 12px; color: #6B7280; letter-spacing: 3px; margin-top: 2px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(245,158,11,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="level-text">RING 1</div>
    </div>
    <div id="overlay">
        <h1 id="title">ORBIT LOCK</h1>
        <p id="subtitle">TAP TO LOCK ONTO THE TARGET</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-locks">Locks: 0</div>
            <div class="sm" id="stat-perfect">Perfect locks: 0</div>
            <div class="sm" id="stat-streak">Best streak: 0</div>
        </div>
        <button class="btn" id="start-btn">ORBIT</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelText = document.getElementById('level-text');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, cX, cY, playing = false, score = 0, frame = 0;
        let orbitAngle = 0, orbitSpeed = 0.03, orbitRadius = 100;
        let targetAngle = 0, targetSize = 0.4;
        let ring = 1, locks = 0, perfectLocks = 0, streak = 0, bestStreak = 0;
        let particles = [], pops = [], flashAlpha = 0;
        let lives = 3;
        const RING_COLORS = ['#F59E0B', '#3B82F6', '#10B981', '#EC4899', '#8B5CF6', '#EF4444'];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; cX = W / 2; cY = H / 2; }
        window.addEventListener('resize', resize); resize();

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function burst(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i; const v = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.025, color, size: 2 + Math.random() * 3 });
            }
        }

        function nextRing() {
            ring++;
            orbitSpeed = 0.03 + ring * 0.005 + Math.random() * 0.01;
            if (ring % 3 === 0) orbitSpeed *= -1; // Reverse direction
            orbitRadius = 80 + Math.random() * 60;
            targetAngle = Math.random() * Math.PI * 2;
            targetSize = Math.max(0.2, 0.45 - ring * 0.015);
            levelText.textContent = `RING ${ring}`;
        }

        function tap() {
            if (!playing) return;
            let angleDiff = Math.abs(orbitAngle - targetAngle);
            if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

            const px = cX + Math.cos(orbitAngle) * orbitRadius;
            const py = cY + Math.sin(orbitAngle) * orbitRadius;
            const color = RING_COLORS[(ring - 1) % RING_COLORS.length];

            if (angleDiff < targetSize * 0.5) {
                // Perfect lock
                perfectLocks++; locks++; streak++;
                if (streak > bestStreak) bestStreak = streak;
                const pts = 100 + (streak > 3 ? streak * 20 : 0);
                score += pts;
                burst(px, py, '#10B981', 25);
                pops.push({ x: px, y: py - 20, text: `PERFECT +${pts}`, life: 1, vy: -2, color: '#10B981' });
                flashAlpha = 0.3;
                nextRing();
            } else if (angleDiff < targetSize) {
                // Good lock
                locks++; streak++;
                if (streak > bestStreak) bestStreak = streak;
                const pts = 50 + (streak > 3 ? streak * 10 : 0);
                score += pts;
                burst(px, py, color, 15);
                pops.push({ x: px, y: py - 20, text: `+${pts}`, life: 1, vy: -2, color });
                flashAlpha = 0.15;
                nextRing();
            } else {
                // Miss
                streak = 0; lives--;
                burst(px, py, '#EF4444', 10);
                pops.push({ x: px, y: py - 20, text: 'MISS', life: 1, vy: -2, color: '#EF4444' });
                flashAlpha = 0.2;
                if (lives <= 0) { gameOver(); return; }
            }

            scoreEl.textContent = score;
            post('GAMEPLAY', 'SCORE_UPDATE', { score, ring });
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); tap(); }, { passive: false });
        window.addEventListener('mousedown', tap);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            score = 0; ring = 0; locks = 0; perfectLocks = 0; streak = 0; bestStreak = 0; lives = 3;
            frame = 0; orbitAngle = 0; particles = []; pops = [];
            scoreEl.textContent = '0';
            nextRing(); post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            frame++;
            orbitAngle += orbitSpeed;
            if (orbitAngle > Math.PI * 2) orbitAngle -= Math.PI * 2;
            if (orbitAngle < 0) orbitAngle += Math.PI * 2;

            if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - 0.01);
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = pops.length - 1; i >= 0; i--) { pops[i].y += pops[i].vy; pops[i].life -= 0.02; if (pops[i].life <= 0) pops.splice(i, 1); }
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            const color = RING_COLORS[(ring - 1) % RING_COLORS.length];

            // Background glow
            if (flashAlpha > 0) {
                const g = ctx.createRadialGradient(cX, cY, 0, cX, cY, orbitRadius + 50);
                g.addColorStop(0, `rgba(245,158,11,${flashAlpha})`); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            }

            // Previous ring traces
            for (let i = 1; i < Math.min(ring, 5); i++) {
                ctx.globalAlpha = 0.03;
                ctx.strokeStyle = RING_COLORS[(ring - 1 - i) % RING_COLORS.length];
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cX, cY, 80 + i * 25, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Orbit ring
            ctx.strokeStyle = color + '33';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cX, cY, orbitRadius, 0, Math.PI * 2); ctx.stroke();

            // Target zone
            const tStartAngle = targetAngle - targetSize;
            const tEndAngle = targetAngle + targetSize;
            ctx.strokeStyle = color;
            ctx.lineWidth = 8;
            ctx.shadowBlur = 20; ctx.shadowColor = color;
            ctx.beginPath(); ctx.arc(cX, cY, orbitRadius, tStartAngle, tEndAngle); ctx.stroke();

            // Perfect zone (inner arc)
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10; ctx.shadowColor = '#10B981';
            ctx.beginPath(); ctx.arc(cX, cY, orbitRadius, targetAngle - targetSize * 0.5, targetAngle + targetSize * 0.5); ctx.stroke();
            ctx.shadowBlur = 0;

            // Target marker
            const tx = cX + Math.cos(targetAngle) * orbitRadius;
            const ty = cY + Math.sin(targetAngle) * orbitRadius;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI * 2); ctx.fill();

            // Orbiting ball
            const px = cX + Math.cos(orbitAngle) * orbitRadius;
            const py = cY + Math.sin(orbitAngle) * orbitRadius;

            // Ball trail
            for (let i = 1; i <= 8; i++) {
                const trailAngle = orbitAngle - orbitSpeed * i * 2;
                const trailX = cX + Math.cos(trailAngle) * orbitRadius;
                const trailY = cY + Math.sin(trailAngle) * orbitRadius;
                ctx.globalAlpha = 0.3 - i * 0.035;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(trailX, trailY, 6 - i * 0.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Ball
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Center
            ctx.fillStyle = color + '15';
            ctx.beginPath(); ctx.arc(cX, cY, 20, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = color + '30'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(cX, cY, 20, 0, Math.PI * 2); ctx.stroke();

            // Lives
            ctx.textAlign = 'right'; ctx.font = 'bold 14px Inter, sans-serif';
            for (let i = 0; i < 3; i++) {
                ctx.globalAlpha = i < lives ? 0.8 : 0.15;
                ctx.fillStyle = '#EF4444';
                ctx.fillText('♥', W - 20 - i * 22, 65);
            }
            ctx.globalAlpha = 1;

            // Streak
            if (streak >= 3) {
                ctx.fillStyle = '#F59E0B'; ctx.font = 'bold 14px Inter, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`🔥 ${streak}x`, cX, cY + orbitRadius + 50);
            }

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;
            pops.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.font = `bold ${14 + (1 - p.life) * 4}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); }); ctx.globalAlpha = 1;

            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post('GAMEPLAY', 'GAME_COMPLETE', { score, locks, perfectLocks, bestStreak, status: 'loss' });
            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'ORBIT LOST';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box'); stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-locks').textContent = `Locks: ${locks}`;
            document.getElementById('stat-perfect').textContent = `Perfect locks: ${perfectLocks}`;
            document.getElementById('stat-streak').textContent = `Best streak: ${bestStreak}x`;
            startBtn.textContent = 'RE-ORBIT';
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
