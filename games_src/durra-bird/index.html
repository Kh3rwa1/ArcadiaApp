<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Durra Bird | Arcadia</title>
    <style>
        :root { --void: #0C4A6E; --accent: #22D3EE; --accent2: #34D399; }
        body { margin: 0; background: #0C4A6E; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 55px; width: 100%; text-align: center; pointer-events: none; }
        #score { font-size: 52px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(6px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #ccc; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 4px 20px rgba(34,211,238,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #ccc; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui"><div id="score">0</div></div>
    <div id="overlay">
        <h1 id="title">DURRA BIRD</h1>
        <p id="subtitle">TAP TO FLY · AVOID PIPES</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-pipes">Pipes passed: 0</div>
            <div class="sm" id="stat-near">Near misses: 0</div>
        </div>
        <button class="btn" id="start-btn">FLY</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, frame = 0, score = 0;
        let bird, pipes, particles, clouds;
        let nearMisses = 0, pipesPassed = 0;
        let groundScroll = 0, speed = 3;
        let shakeX = 0, shakeY = 0, shakeDur = 0;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function shake(i, d) { shakeDur = d; shakeX = (Math.random() - 0.5) * i; shakeY = (Math.random() - 0.5) * i; }
        function burst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i; const v = 2 + Math.random() * 3;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.03, color, size: 2 + Math.random() * 2 });
            }
        }

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W * 1.5, y: 30 + Math.random() * H * 0.35, w: 60 + Math.random() * 80, h: 20 + Math.random() * 15, speed: 0.3 + Math.random() * 0.5 });
        }

        function initGame() {
            bird = { x: W * 0.2, y: H / 2, vy: 0, rotation: 0, wingPhase: 0 };
            pipes = []; particles = []; score = 0; pipesPassed = 0; nearMisses = 0;
            frame = 0; speed = 3; groundScroll = 0;
            initClouds();
        }

        function flap() {
            if (!playing) return;
            bird.vy = -7.5;
            bird.wingPhase = 0;
            burst(bird.x - 8, bird.y + 6, 'rgba(255,255,255,0.4)', 4);
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
        window.addEventListener('mousedown', flap);

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            initGame(); post('GAMEPLAY', 'GAME_START');
        };

        function spawnPipe() {
            const gapY = H * 0.25 + Math.random() * H * 0.4;
            const gap = Math.max(110, 170 - score * 2);
            pipes.push({ x: W + 50, gapY, gap, passed: false, nearMissed: false, scored: false });
        }

        function update() {
            if (!playing) return;
            frame++;
            speed = 3 + score * 0.08;
            groundScroll = (groundScroll + speed) % 40;

            // Bird physics
            bird.vy += 0.4;
            bird.y += bird.vy;
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
            bird.wingPhase = Math.min(1, bird.wingPhase + 0.08);

            // Clouds
            clouds.forEach(c => { c.x -= c.speed; if (c.x + c.w < -10) { c.x = W + 50; c.y = 30 + Math.random() * H * 0.35; } });

            // Pipes
            if (frame % Math.max(50, 100 - score * 2) === 0) spawnPipe();

            const groundY = H - 50;
            const pipeW = 52;

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= speed;

                // Collision
                if (bird.x + 12 > p.x && bird.x - 12 < p.x + pipeW) {
                    if (bird.y - 10 < p.gapY - p.gap / 2 || bird.y + 10 > p.gapY + p.gap / 2) {
                        gameOver(); return;
                    }
                    // Near miss
                    if (!p.nearMissed) {
                        const topDist = Math.abs(bird.y - (p.gapY - p.gap / 2));
                        const botDist = Math.abs(bird.y - (p.gapY + p.gap / 2));
                        if (Math.min(topDist, botDist) < 20) { p.nearMissed = true; nearMisses++; }
                    }
                }

                if (!p.scored && p.x + pipeW < bird.x) {
                    p.scored = true; score++; pipesPassed++;
                    scoreEl.textContent = score;
                    if (score % 5 === 0) post('GAMEPLAY', 'SCORE_UPDATE', { score });
                }

                if (p.x + pipeW < -10) pipes.splice(i, 1);
            }

            // Ground/ceiling collision
            if (bird.y > groundY - 10 || bird.y < 10) { gameOver(); return; }

            // Shake / particles
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
        }

        function draw() {
            ctx.save(); ctx.translate(shakeX, shakeY);

            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#0369A1'); skyGrad.addColorStop(0.6, '#0EA5E9'); skyGrad.addColorStop(1, '#34D399');
            ctx.fillStyle = skyGrad; ctx.fillRect(-5, -5, W + 10, H + 10);

            // Clouds
            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath(); ctx.ellipse(c.x + c.w * 0.3, c.y, c.w * 0.4, c.h, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(c.x + c.w * 0.65, c.y + 3, c.w * 0.35, c.h * 0.8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(c.x + c.w * 0.5, c.y - 5, c.w * 0.3, c.h * 0.7, 0, 0, Math.PI * 2); ctx.fill();
            });

            const groundY = H - 50;
            const pipeW = 52;

            // Pipes
            pipes.forEach(p => {
                const topH = p.gapY - p.gap / 2;
                const botY = p.gapY + p.gap / 2;

                // Pipe body - top
                const pGrad1 = ctx.createLinearGradient(p.x, 0, p.x + pipeW, 0);
                pGrad1.addColorStop(0, '#059669'); pGrad1.addColorStop(0.5, '#10B981'); pGrad1.addColorStop(1, '#047857');
                ctx.fillStyle = pGrad1;
                ctx.fillRect(p.x, 0, pipeW, topH);
                ctx.fillRect(p.x - 4, topH - 20, pipeW + 8, 20);

                // Pipe body - bottom
                ctx.fillStyle = pGrad1;
                ctx.fillRect(p.x, botY, pipeW, groundY - botY);
                ctx.fillRect(p.x - 4, botY, pipeW + 8, 20);

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(p.x + 4, 0, 6, topH);
                ctx.fillRect(p.x + 4, botY, 6, groundY - botY);
            });

            // Ground
            ctx.fillStyle = '#92400E';
            ctx.fillRect(-5, groundY, W + 10, H - groundY + 5);
            ctx.fillStyle = '#A16207';
            ctx.fillRect(-5, groundY, W + 10, 8);
            // Ground dashes
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
            const off = groundScroll;
            for (let x = -off; x < W + 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, groundY + 15); ctx.lineTo(x + 15, groundY + 15); ctx.stroke(); }

            // Bird
            ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rotation);

            // Body
            ctx.fillStyle = '#FBBF24';
            ctx.beginPath(); ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2); ctx.fill();
            // Belly
            ctx.fillStyle = '#FDE68A';
            ctx.beginPath(); ctx.ellipse(2, 3, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
            // Wing
            const wingY = Math.sin(bird.wingPhase * Math.PI) * 6;
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath(); ctx.ellipse(-4, -2 + wingY, 10, 5, -0.3, 0, Math.PI * 2); ctx.fill();
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(8, -3, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(9, -3, 2.5, 0, Math.PI * 2); ctx.fill();
            // Beak
            ctx.fillStyle = '#EF4444';
            ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(20, 2); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill();

            ctx.restore();

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false; shake(12, 15);
            burst(bird.x, bird.y, '#FBBF24', 20);
            post('GAMEPLAY', 'GAME_COMPLETE', { score, pipesPassed, nearMisses, status: 'loss' });
            setTimeout(() => {
                overlay.style.display = 'flex';
                document.getElementById('title').textContent = 'CRASHED';
                document.getElementById('subtitle').textContent = '';
                const stats = document.getElementById('stats-box'); stats.style.display = 'block';
                document.getElementById('final-score').textContent = score;
                document.getElementById('stat-pipes').textContent = `Pipes passed: ${pipesPassed}`;
                document.getElementById('stat-near').textContent = `Near misses: ${nearMisses}`;
                startBtn.textContent = 'RETRY';
            }, 400);
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
