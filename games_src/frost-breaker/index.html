<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frost Breaker | Arcadia</title>
    <style>
        :root { --void: #030712; --accent: #22D3EE; --accent2: #A855F7; }
        body { margin: 0; background: var(--void); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 50px; width: 100%; text-align: center; pointer-events: none; }
        #score { font-size: 42px; font-weight: 900; text-shadow: 0 0 20px var(--accent); }
        #level-text { font-size: 12px; color: #6B7280; letter-spacing: 3px; margin-top: 2px; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(8px); }
        #overlay h1 { font-size: 42px; font-weight: 900; margin: 0 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #overlay p { color: #9CA3AF; margin-bottom: 32px; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 18px 52px; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; letter-spacing: 3px; box-shadow: 0 0 30px rgba(34,211,238,0.4); }
        .btn:active { transform: scale(0.96); }
        #stats-box { text-align: center; margin-bottom: 20px; display: none; }
        #stats-box .big { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-box .sm { font-size: 13px; color: #6B7280; margin: 3px 0; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="level-text">LEVEL 1</div>
    </div>
    <div id="overlay">
        <h1 id="title">FROST BREAKER</h1>
        <p id="subtitle">DRAG PADDLE · BREAK ALL BRICKS</p>
        <div id="stats-box">
            <div class="big" id="final-score">0</div>
            <div class="sm" id="stat-bricks">Bricks broken: 0</div>
            <div class="sm" id="stat-level">Level reached: 0</div>
        </div>
        <button class="btn" id="start-btn">BREAK</button>
    </div>
    <canvas id="game"></canvas>

    <script src="../_template/arcadia-aaa-pack.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelTextEl = document.getElementById('level-text');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let W, H, playing = false, score = 0, level = 1;
        let paddle, ball, bricks, particles, powerUps;
        let bricksSmashed = 0, lives = 3;
        let shakeX = 0, shakeY = 0, shakeDur = 0;

        const BRICK_COLORS = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899'];

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function post(t, a, p = {}) {
            const msg = JSON.stringify({ version: '1.0', type: t, action: a, payload: p });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent?.postMessage(msg, '*');
        }
        post('LIFECYCLE', 'HEARTBEAT_READY', { engine: 'canvas' });

        function shake(i, d) { shakeDur = d; shakeX = (Math.random() - 0.5) * i; shakeY = (Math.random() - 0.5) * i; }
        function burst(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2; const v = 1.5 + Math.random() * 3;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, decay: 0.03, color, size: 2 + Math.random() * 3 });
            }
        }

        function buildLevel() {
            bricks = [];
            const cols = Math.min(8, 5 + Math.floor(level / 3));
            const rows = Math.min(7, 3 + Math.floor(level / 2));
            const bw = (W - 40) / cols;
            const bh = 22;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const hp = r < 2 && level > 2 ? 2 : 1;
                    bricks.push({ x: 20 + c * bw, y: 130 + r * (bh + 4), w: bw - 4, h: bh, color: BRICK_COLORS[r % BRICK_COLORS.length], hp, maxHp: hp });
                }
            }
        }

        function initGame() {
            paddle = { x: W / 2 - 45, y: H - 70, w: 90, h: 14 };
            ball = { x: W / 2, y: H - 100, vx: 3, vy: -4, r: 7, speed: 5, stuck: true };
            particles = []; powerUps = [];
            score = 0; level = 1; bricksSmashed = 0; lives = 3;
            buildLevel();
        }

        const movePaddle = (e) => {
            if (!playing) return;
            const t = e.touches ? e.touches[0] : e;
            paddle.x = Math.max(0, Math.min(W - paddle.w, t.clientX - paddle.w / 2));
            if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; }
        };
        window.addEventListener('mousemove', movePaddle);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); movePaddle(e); }, { passive: false });
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); movePaddle(e);
            if (ball.stuck) { ball.stuck = false; ball.vy = -ball.speed; ball.vx = (Math.random() - 0.5) * 4; }
        }, { passive: false });
        window.addEventListener('mousedown', () => {
            if (ball.stuck) { ball.stuck = false; ball.vy = -ball.speed; ball.vx = (Math.random() - 0.5) * 4; }
        });

        startBtn.onclick = (e) => {
            e.stopPropagation(); playing = true; overlay.style.display = 'none';
            document.getElementById('stats-box').style.display = 'none';
            initGame(); post('GAMEPLAY', 'GAME_START');
        };

        function update() {
            if (!playing) return;
            if (ball.stuck) return;

            ball.x += ball.vx; ball.y += ball.vy;

            // Wall bounces
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
            if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

            // Bottom — lose life
            if (ball.y > H + 20) {
                lives--;
                if (lives <= 0) { gameOver(); return; }
                ball.stuck = true; ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 2;
            }

            // Paddle collision
            if (ball.vy > 0 && ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h + 10 &&
                ball.x > paddle.x - 5 && ball.x < paddle.x + paddle.w + 5) {
                ball.vy = -Math.abs(ball.vy);
                const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                ball.vx = hit * ball.speed;
                burst(ball.x, paddle.y, '#22D3EE', 6);
            }

            // Brick collision
            for (let i = bricks.length - 1; i >= 0; i--) {
                const b = bricks[i];
                if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
                    ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {

                    b.hp--;
                    if (b.hp <= 0) {
                        bricks.splice(i, 1);
                        bricksSmashed++;
                        score += 10 * level;
                        burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 12);
                        shake(4, 6);

                        // Power-up drop
                        if (Math.random() < 0.12) {
                            powerUps.push({ x: b.x + b.w / 2, y: b.y, vy: 1.5, type: Math.random() < 0.5 ? 'wide' : 'life' });
                        }
                    } else {
                        burst(b.x + b.w / 2, b.y + b.h / 2, '#fff', 4);
                    }

                    // Determine bounce direction
                    const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
                    const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
                    if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;

                    scoreEl.textContent = score;
                    break;
                }
            }

            // Power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                p.y += p.vy;
                if (p.y > paddle.y && p.y < paddle.y + paddle.h + 15 && p.x > paddle.x && p.x < paddle.x + paddle.w) {
                    if (p.type === 'wide') { paddle.w = Math.min(150, paddle.w + 20); setTimeout(() => paddle.w = 90, 8000); }
                    else if (p.type === 'life') { lives = Math.min(5, lives + 1); }
                    burst(p.x, p.y, '#10B981', 10);
                    powerUps.splice(i, 1);
                } else if (p.y > H + 20) { powerUps.splice(i, 1); }
            }

            // Level complete
            if (bricks.length === 0) {
                level++;
                levelTextEl.textContent = `LEVEL ${level}`;
                ball.stuck = true; ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 2;
                ball.speed = Math.min(8, 5 + level * 0.3);
                buildLevel();
                post('GAMEPLAY', 'SCORE_UPDATE', { score, level });
            }

            // Shake / particles
            if (shakeDur > 0) { shakeDur--; shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = shakeY = 0; }
            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); }
        }

        function draw() {
            ctx.save(); ctx.translate(shakeX, shakeY);
            ctx.fillStyle = '#030712'; ctx.fillRect(-5, -5, W + 10, H + 10);

            // Ambient
            const g = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, W * 0.5);
            g.addColorStop(0, 'rgba(34,211,238,0.04)'); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

            // Bricks
            bricks.forEach(b => {
                const alpha = b.hp < b.maxHp ? 0.5 : 1;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 6; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // Paddle
            const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
            pGrad.addColorStop(0, '#22D3EE'); pGrad.addColorStop(1, '#0891B2');
            ctx.fillStyle = pGrad;
            ctx.shadowBlur = 15; ctx.shadowColor = '#22D3EE';
            ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
            ctx.shadowBlur = 0;

            // Ball
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Ball trail
            if (!ball.stuck) {
                for (let i = 1; i <= 5; i++) {
                    ctx.globalAlpha = 0.15 - i * 0.025;
                    ctx.fillStyle = '#22D3EE';
                    ctx.beginPath(); ctx.arc(ball.x - ball.vx * i * 0.8, ball.y - ball.vy * i * 0.8, ball.r * (1 - i * 0.12), 0, Math.PI * 2); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // Power-ups
            powerUps.forEach(p => {
                ctx.fillStyle = p.type === 'wide' ? '#22D3EE' : '#10B981';
                ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'wide' ? 'W' : '♥', p.x, p.y);
                ctx.shadowBlur = 0;
            });

            // Lives
            ctx.textAlign = 'right'; ctx.font = 'bold 14px Inter, sans-serif';
            for (let i = 0; i < 5; i++) {
                ctx.globalAlpha = i < lives ? 0.8 : 0.12;
                ctx.fillStyle = '#EF4444';
                ctx.fillText('♥', W - 15 - i * 20, 65);
            }
            ctx.globalAlpha = 1;

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;

            ctx.restore();
            requestAnimationFrame(() => { update(); draw(); });
        }

        function gameOver() {
            playing = false;
            post('GAMEPLAY', 'GAME_COMPLETE', { score, bricksSmashed, level, status: 'loss' });
            overlay.style.display = 'flex';
            document.getElementById('title').textContent = 'GAME OVER';
            document.getElementById('subtitle').textContent = '';
            const stats = document.getElementById('stats-box'); stats.style.display = 'block';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-bricks').textContent = `Bricks broken: ${bricksSmashed}`;
            document.getElementById('stat-level').textContent = `Level reached: ${level}`;
            startBtn.textContent = 'RETRY';
        }

        window.addEventListener('ArcadiaBridge', (e) => { const { action } = e.detail || {}; if (action === 'LIFECYCLE_PAUSE') playing = false; if (action === 'LIFECYCLE_RESUME' && overlay.style.display === 'none') playing = true; });
        draw();
    </script>
</body>

</html>
